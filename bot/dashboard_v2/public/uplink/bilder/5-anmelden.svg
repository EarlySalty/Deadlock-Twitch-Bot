<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t">
<title id="t">Chat-Dock in OBS: links der abgemeldete Zustand mit Anmelden-Knopf, rechts der angemeldete Chat</title>
<style>
  text { font-family: system-ui, sans-serif; }
  .lbl { fill: #e6e6e6; font-size: 15px; }
  .dim { fill: #9a9a9a; font-size: 14px; }
  .feld { fill: #e6e6e6; font-size: 14px; font-family: monospace; }
  .mark { fill: #efd49d; font-size: 14px; font-weight: 700; }
  .titel { fill: #e6e6e6; font-size: 16px; font-weight: 600; }
</style>
<rect width="900" height="300" rx="10" fill="#2b2b2b" stroke="#1e1e1e"/>
<text x="24" y="34" class="titel">Chat</text>
<text x="480" y="34" class="titel">Chat</text>
<rect x="24" y="74" width="404" height="180" rx="6" fill="#232323" stroke="#1e1e1e"/>
<text x="226" y="134" text-anchor="middle" class="dim">Melde dich an, um zu chatten</text>
<rect x="156" y="156" width="140" height="36" rx="4" fill="#9147ff"/>
<text x="226" y="180" text-anchor="middle" class="lbl" font-weight="600">Anmelden</text>
<rect x="151" y="151" width="150" height="46" rx="8" fill="none" stroke="#c8a86b" stroke-width="2.5"/>
<circle cx="324" cy="174" r="14" fill="#c8a86b"/><text x="324" y="179" text-anchor="middle" font-size="15" font-weight="800" fill="#241c11" font-family="system-ui, sans-serif">1</text>
<text x="24" y="66" class="dim" font-size="12">beim ersten Öffnen</text>
<text x="480" y="66" class="dim" font-size="12">danach, dauerhaft</text>
<rect x="480" y="74" width="396" height="180" rx="6" fill="#232323" stroke="#1e1e1e"/>
<text x="498" y="104" font-size="13" font-weight="700" fill="#4a9eff" font-family="system-ui, sans-serif">Lea:</text>
<text x="539" y="104" class="dim" font-size="13">gg wp</text>
<text x="498" y="136" font-size="13" font-weight="700" fill="#3ecf8e" font-family="system-ui, sans-serif">Mika:</text>
<text x="548" y="136" class="dim" font-size="13">der Fight war nice</text>
<text x="498" y="168" font-size="13" font-weight="700" fill="#ff6b9d" font-family="system-ui, sans-serif">Tobi:</text>
<text x="548" y="168" class="dim" font-size="13">PogChamp</text>
<text x="498" y="200" font-size="13" font-weight="700" fill="#ffb454" font-family="system-ui, sans-serif">Sam:</text>
<text x="539" y="200" class="dim" font-size="13">wie heisst der Build?</text>
<rect x="498" y="220" width="300" height="26" rx="4" fill="#18181b" stroke="#3a3a3d"/>
<text x="510" y="238" class="dim" font-size="12">Nachricht senden</text>
<text x="24" y="278" class="mark">Einmal auf „Anmelden“, danach merkt sich OBS die Anmeldung dauerhaft.</text>
</svg>