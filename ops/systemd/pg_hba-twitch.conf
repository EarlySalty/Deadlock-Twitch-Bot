# Vor der allgemeinen Zeile `local all all peer` in pg_hba.conf einfügen.
# Die Peer-Identitäten dürfen ausschließlich die Twitch-Anwendungs-DB öffnen.
local   twitch_analytics twitchbot                               peer
local   all             twitchbot                               reject
local   twitch_analytics twitchdash                              peer
local   all             twitchdash                              reject

# Die Übergangsrolle besitzt ein Passwort für noch nicht getrennte Dienste,
# darf damit aber ausschließlich die Twitch-Datenbank erreichen.
host    twitch_analytics twitchlegacy 127.0.0.1/32               scram-sha-256
host    all             twitchlegacy 127.0.0.1/32               reject
host    twitch_analytics twitchlegacy ::1/128                    scram-sha-256
host    all             twitchlegacy ::1/128                    reject
