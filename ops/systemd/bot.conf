# Nicht geheime Laufzeitkonfiguration. Der gemeinsame Teil wird beim Deploy aus
# der bestehenden normalen Bot-Konfiguration installiert.
source /etc/deadlock-twitch/runtime-common.conf

# Peer-Authentifizierung: Unix-Konto twitchbot == PostgreSQL-Rolle twitchbot.
TWITCH_BOT_ANALYTICS_DSN='postgresql:///twitch_analytics?host=/var/run/postgresql&application_name=tb-bot'

# Nur der separate One-shot darf Migrationen und anderes DDL ausführen.
TB_DB_MIGRATE=0

# Diese Cutover-Gates werden nach dem Infisical-Load erneut eingelesen und
# dürfen deshalb nicht von alten Werten im gemeinsamen Profil überschrieben werden.
TWITCH_RUNTIME_ENFORCE=1
TWITCH_SPLIT_RUNTIME_ENFORCE=1
TWITCH_RUNTIME_ROLE='twitch_worker'
TB_MCP_HOST='127.0.0.1'
TB_MCP_PORT=8892
VOICE_REACTION_STREAMLINK_BIN='/usr/local/libexec/deadlock-streamlink'
