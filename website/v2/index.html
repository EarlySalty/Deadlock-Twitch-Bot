<!DOCTYPE html>
<!-- V2-Preview der Streamer-Landing im schwarzen Patch-Theme.
     Gleiche App wie /streamer/ (src/main.tsx), nur data-theme="v2" aktiviert
     die Schwarz-Overrides aus src/theme-v2.css. Bewusst noindex + CSR
     (kein prerender-Attribut am Script) — reine Vergleichs-/Testseite. -->
<html lang="de" data-theme="v2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Streamer-Landing V2 (Patch-Schwarz) — Deutsche Deadlock Community</title>
    <meta name="description" content="Interne Vorschau der Streamer-Landing im schwarzen Patch-Theme." />

    <!-- Original bleibt kanonisch, damit die Preview keinen Duplicate-Content erzeugt -->
    <link rel="canonical" href="https://deutsche-deadlock-community.de/streamer/" />
    <link rel="icon" type="image/png" href="/brand/logo/favicon-64.png" />
    <meta name="theme-color" content="#0b0b0b" />

    <!-- Fonts self-hosted (DSGVO-konform, kein externer Request) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Einheitliche Brand-Aufzug-Nav (dl-brand, von Caddy unter /brand/* gedient) -->
    <link rel="stylesheet" href="/brand/tokens.css" />
    <link rel="stylesheet" href="/brand/nav.css" />
    <script src="/brand/nav.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
