<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dein Stream stirbt. Deine Viewer nicht.</title>
<style>
@font-face{font-family:"Sora";font-style:normal;font-weight:400 800;font-display:swap;src:url("/testing/fonts/sora-latin.woff2") format("woff2");}
@font-face{font-family:"Manrope";font-style:normal;font-weight:400 800;font-display:swap;src:url("/testing/fonts/manrope-latin.woff2") format("woff2");}

:root{
  --bg:#07151d; --text:#e9f1f7; --muted:#9bb3c5;
  --cyan:#06B6D4; --violet:#A855F7; --orange:#ff7a18; --teal:#10b7ad; --magenta:#ff2f7e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Manrope",sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

.hero{
  position:relative; min-height:100vh; width:100%;
  overflow:hidden; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
}

/* Layer-Stack */
.layer{position:absolute;inset:0}
#tunnel{z-index:1}
.halftone{z-index:2;mix-blend-mode:screen;opacity:.5;
  background-image:radial-gradient(rgba(186,210,224,.42) 1px, transparent 1.4px);
  background-size:7px 7px;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 48%, #000 35%, transparent 92%);
  mask-image:radial-gradient(ellipse 75% 70% at 50% 48%, #000 35%, transparent 92%);}
#grain{z-index:6;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
.scanlines{z-index:7;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.32) 3px, rgba(0,0,0,0) 4px);
  will-change:transform}
.vignette{z-index:8;pointer-events:none;
  background:radial-gradient(ellipse 90% 80% at 50% 46%, transparent 55%, rgba(0,0,0,.78) 100%)}

/* Kaltstart: VHS-Tracking-Wisch + Einschalt-Overshoot */
.boot{position:absolute;inset:0;z-index:30;pointer-events:none;background:#000;will-change:opacity}
.tracking{position:absolute;left:0;right:0;height:22%;z-index:31;pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(255,255,255,.06) 30%, rgba(255,255,255,.92) 50%, rgba(6,182,212,.25) 60%, transparent);
  mix-blend-mode:screen;will-change:transform,opacity;opacity:0}
.flash{position:absolute;inset:0;z-index:32;pointer-events:none;background:#fff;opacity:0;mix-blend-mode:screen;will-change:opacity}

/* Riss-Haelften (SW-Bild reisst auf, Cyan bricht durch) */
.rift{position:absolute;inset:0;z-index:4;pointer-events:none}
.rift-half{position:absolute;inset:0;will-change:transform;
  background:
    radial-gradient(ellipse 60% 55% at 50% 50%, rgba(20,38,48,.0), rgba(4,11,15,.55) 100%),
    linear-gradient(180deg, #0a1b24, #06121a);
  opacity:0}
.rift-half.L{clip-path:inset(0 50% 0 0)}
.rift-half.R{clip-path:inset(0 0 0 50%)}
.rift-edge{position:absolute;top:0;bottom:0;width:2px;left:50%;transform:translateX(-50%);z-index:5;
  background:linear-gradient(180deg, transparent, var(--cyan), transparent);
  box-shadow:0 0 18px var(--cyan),0 0 42px rgba(6,182,212,.55);opacity:0;will-change:opacity}

/* Text-Layer */
.content{position:relative;z-index:10;width:min(1100px,92vw);
  padding:48px 20px;text-align:center}

.accuse{margin-bottom:30px}
.accuse .line{font-family:"Sora",sans-serif;font-weight:800;font-style:italic;
  font-size:clamp(34px,7.4vw,86px);line-height:.96;letter-spacing:-.01em;
  text-transform:uppercase;transform:skewX(-7deg);
  opacity:0;will-change:transform,opacity}
.accuse .l1{color:#fff}
.accuse .l2{color:#7c93a3}
.accuse .l3{color:#e8e8e8}

/* Chroma-Split Geisterkanten (statisch, dezent) */
.chroma{text-shadow:-1px 0 rgba(255,40,80,.6), 1px 0 rgba(6,182,212,.6)}
.flicker.in{animation:flick .42s steps(2) 1}
@keyframes flick{0%{opacity:1}25%{opacity:.45;color:#ff3355}55%{opacity:1}75%{opacity:.5;color:#ff3355}100%{opacity:1}}

/* Rueckwaerts-Counter unter der Anklage */
.counter{margin:20px auto 0;display:inline-flex;align-items:baseline;gap:10px;
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:clamp(13px,2.1vw,18px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);opacity:0;will-change:opacity}
.counter .val{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.2ch;
  text-align:right;color:#fff}
.counter.up .val{color:var(--cyan);text-shadow:0 0 16px rgba(6,182,212,.55)}
.counter .arrow{color:var(--cyan);opacity:0;transition:opacity .2s}
.counter.up .arrow{opacity:1}

/* Drop-Headline (crasht rein) */
.drop{opacity:0;will-change:transform,opacity}
.drop h2{font-family:"Sora",sans-serif;font-weight:800;font-style:italic;
  text-transform:uppercase;transform:skewX(-6deg);line-height:.98;letter-spacing:-.01em}
.drop .d1{font-size:clamp(30px,6.4vw,76px);color:#fff}
.drop .d2{font-size:clamp(22px,4.6vw,54px);color:var(--cyan);
  text-shadow:0 0 28px rgba(6,182,212,.45)}

/* Avatar-Strip (Halftone-Punktportraits, durch Cyan-Linie verbunden) */
.strip{position:relative;margin:34px auto 0;max-width:760px;height:78px;opacity:0;will-change:opacity}
.strip .nodes{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 8px;z-index:2}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;
  background-color:#16303d;
  background-image:radial-gradient(rgba(220,235,245,.85) .9px, transparent 1.3px);
  background-size:4px 4px;
  border:1px solid rgba(6,182,212,.35);
  box-shadow:inset 0 0 14px rgba(0,0,0,.6);transition:box-shadow .25s, transform .25s}
.avatar.hit{box-shadow:0 0 0 2px var(--cyan),0 0 24px rgba(6,182,212,.7);transform:scale(1.12)}
.avatar .plus{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;color:var(--cyan);
  opacity:0;transition:opacity .15s}
.avatar.hit .plus{opacity:1}

/* CTA */
.cta{margin-top:40px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  opacity:0;will-change:opacity}
.btn{font-family:"Sora",sans-serif;font-weight:800;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;border-radius:0;padding:16px 30px;cursor:pointer;
  text-decoration:none;display:inline-block;position:relative;transition:transform .12s}
.btn-primary{background:var(--cyan);color:#04121a;border:none}
.btn-primary:hover{transform:translateY(-2px);
  text-shadow:-2px 0 rgba(255,40,80,.85), 2px 0 rgba(168,85,247,.85);
  animation:ctaglitch .18s steps(2) infinite}
@keyframes ctaglitch{0%{transform:translate(-1px,-2px)}50%{transform:translate(2px,-2px)}100%{transform:translate(-1px,-2px)}}
.btn-secondary{background:transparent;color:var(--text);border:1px solid rgba(155,179,197,.5)}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan)}

/* Marquee-Band unten */
.marquee{position:absolute;left:0;right:0;bottom:0;z-index:9;height:40px;overflow:hidden;
  border-top:1px solid rgba(6,182,212,.22);background:rgba(4,11,15,.55);
  display:flex;align-items:center;pointer-events:none}
.marquee .track{display:inline-flex;white-space:nowrap;will-change:transform;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.32em;
  color:var(--muted);text-transform:uppercase}
.marquee .track span{padding:0 4px}
.marquee .track b{color:var(--cyan);font-weight:700}

/* Replay-Button */
.replay{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:20;
  font-family:"Manrope",sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);background:rgba(7,21,29,.6);
  border:1px solid rgba(155,179,197,.3);border-radius:999px;padding:8px 16px;cursor:pointer;
  backdrop-filter:blur(8px);transition:all .2s}
.replay:hover{color:var(--cyan);border-color:var(--cyan)}

.shake{animation:datamosh .06s steps(2) 1}
@keyframes datamosh{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(0)}}

@media (max-width:640px){
  .content{padding:36px 16px}
  .strip{height:62px}
  .avatar{width:36px;height:36px}
  .cta{margin-top:30px}
  .replay{bottom:50px}
}

@media (prefers-reduced-motion: reduce){
  .flicker.in,.btn-primary:hover{animation:none}
}
</style>
</head>
<body>
<section class="hero" id="hero" aria-label="Dein Stream stirbt. Deine Viewer nicht.">

  <canvas id="tunnel" class="layer" aria-hidden="true"></canvas>
  <div class="halftone layer" aria-hidden="true"></div>

  <div class="rift layer" aria-hidden="true">
    <div class="rift-half L"></div>
    <div class="rift-half R"></div>
  </div>
  <div class="rift-edge" aria-hidden="true"></div>

  <canvas id="grain" class="layer" aria-hidden="true"></canvas>
  <div class="scanlines layer" aria-hidden="true"></div>
  <div class="vignette layer" aria-hidden="true"></div>

  <div class="content">
    <div class="accuse">
      <div class="line l1" data-line="0">Du streamst.</div>
      <div class="line l2" data-line="1">Dann ist es vorbei.</div>
      <div class="line l3 flicker" data-line="2">Deine Viewer gehen.</div>
      <div class="counter" id="counter">
        <span>Viewer</span>
        <span class="arrow" id="cArrow">&uarr;</span>
        <span class="val" id="cVal">247</span>
      </div>
    </div>

    <div class="drop" id="drop">
      <h2>
        <span class="d1">Aber nicht bei uns.</span><br>
        <span class="d2">Das Netzwerk fängt sie.</span>
      </h2>

      <div class="strip" id="strip">
        <div class="nodes" id="nodes"></div>
      </div>

      <div class="cta">
        <a href="#" class="btn btn-primary">Wird Teil der Kette</a>
        <a href="#" class="btn btn-secondary">Wie es läuft &darr;</a>
      </div>
    </div>
  </div>

  <div class="marquee" aria-hidden="true">
    <div class="track" id="marquee"></div>
  </div>

  <div class="boot" id="boot" aria-hidden="true"></div>
  <div class="tracking" id="tracking" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <button class="replay" id="replay" type="button">&#8635; Replay</button>
</section>

<script>
(function(){
  "use strict";

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var hero = document.getElementById("hero");
  var tunnel = document.getElementById("tunnel");
  var grain = document.getElementById("grain");
  var tctx = tunnel.getContext("2d");
  var gctx = grain.getContext("2d");

  var els = {
    boot: document.getElementById("boot"),
    tracking: document.getElementById("tracking"),
    flash: document.getElementById("flash"),
    counter: document.getElementById("counter"),
    cVal: document.getElementById("cVal"),
    cArrow: document.getElementById("cArrow"),
    drop: document.getElementById("drop"),
    strip: document.getElementById("strip"),
    nodes: document.getElementById("nodes"),
    riftEdge: document.querySelector(".rift-edge"),
    riftL: document.querySelector(".rift-half.L"),
    riftR: document.querySelector(".rift-half.R"),
    lines: Array.prototype.slice.call(document.querySelectorAll(".accuse .line")),
    cta: document.querySelector(".cta"),
    marquee: document.getElementById("marquee")
  };

  // ---------- Layout / DPR ----------
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  function sizeCanvas(cv, ctx){
    var r = hero.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function resize(){ sizeCanvas(tunnel, tctx); sizeCanvas(grain, gctx); buildGrain(); }

  // ---------- Avatar-Strip ----------
  var isMobile = window.matchMedia("(max-width:640px)").matches;
  var avatarCount = isMobile ? 7 : 9;
  var avatars = [];
  (function buildAvatars(){
    var line = document.createElement("div");
    line.style.cssText = "position:absolute;left:8px;right:8px;top:50%;height:2px;transform:translateY(-50%);"+
      "background:rgba(6,182,212,.28);z-index:1";
    els.strip.insertBefore(line, els.nodes);
    var pulse = document.createElement("div");
    pulse.id = "stripPulse";
    pulse.style.cssText = "position:absolute;top:50%;height:3px;width:70px;transform:translate(-100%,-50%);"+
      "background:linear-gradient(90deg,transparent,var(--cyan),transparent);"+
      "box-shadow:0 0 14px rgba(6,182,212,.8);z-index:1;opacity:0;will-change:transform,opacity";
    els.strip.insertBefore(pulse, els.nodes);
    els.stripPulse = pulse;
    for(var i=0;i<avatarCount;i++){
      var a = document.createElement("div");
      a.className = "avatar";
      var p = document.createElement("span");
      p.className = "plus";
      p.textContent = "+";
      a.appendChild(p);
      els.nodes.appendChild(a);
      avatars.push(a);
    }
  })();

  // ---------- Marquee ----------
  (function buildMarquee(){
    var unit = ' MOMENTUM <b>//</b> NIE TOT <b>//</b> AUTO-RAID <b>//</b> DDC <b>//</b> ';
    var html = "";
    for(var i=0;i<6;i++){ html += '<span>'+unit+'</span>'; }
    els.marquee.innerHTML = html;
  })();
  var marqOffset = 0;
  var marqWidth = 0;

  // ---------- Tunnel (Canvas) ----------
  // Perspektivischer Pfeil-Tunnel: konzentrische Chevrons, die nach aussen fliessen.
  // Lichtpartikel werden in den Sog gezogen, beim "Riss" Counter-Aufsaugung.
  var tunnelAlpha = 0;       // 0..1 globale Sichtbarkeit (faded ein beim Riss)
  var ringPhase = 0;
  var particles = [];
  var maxParticles = isMobile ? 40 : 80;

  function spawnParticle(){
    if(particles.length >= maxParticles) return;
    var ang = Math.random() * Math.PI * 2;
    var rad = Math.max(W,H) * (0.5 + Math.random()*0.35);
    particles.push({
      ang: ang,
      rad: rad,
      speed: 1.4 + Math.random()*2.2,
      life: 1
    });
  }

  function drawTunnel(t){
    tctx.clearRect(0,0,W,H);
    if(tunnelAlpha <= 0.001) return;
    var cx = W/2, cy = H*0.48;
    tctx.save();
    tctx.globalAlpha = tunnelAlpha;
    tctx.translate(cx, cy);

    // Chevron-Pfeil-Ringe (Tunnel-Perspektive)
    var rings = 9;
    var maxR = Math.max(W,H) * 0.62;
    for(var i=0;i<rings;i++){
      var f = ((i / rings) + ringPhase) % 1;       // 0..1 von innen nach aussen
      var r = 14 + f * f * maxR;                     // quadratisch = Perspektivensog
      var a = (1 - f) * 0.55 * tunnelAlpha;
      if(a <= 0.01) continue;
      tctx.strokeStyle = "rgba(6,182,212," + a.toFixed(3) + ")";
      tctx.lineWidth = 1 + (1 - f) * 2.5;
      // Pfeilform: zwei nach unten zeigende Chevrons (oben + unten gespiegelt)
      var w = r * 1.25, h = r * 0.62;
      tctx.beginPath();
      tctx.moveTo(-w, -h*0.4);
      tctx.lineTo(0, h*0.5);
      tctx.lineTo(w, -h*0.4);
      tctx.stroke();
      tctx.beginPath();
      tctx.moveTo(-w, h*0.4);
      tctx.lineTo(0, -h*0.5);
      tctx.lineTo(w, h*0.4);
      tctx.stroke();
    }

    // Geister-Chroma (Violett) leicht versetzt
    tctx.globalCompositeOperation = "screen";
    tctx.globalAlpha = tunnelAlpha * 0.35;
    tctx.translate(3, 0);
    var f2 = (ringPhase * 1.0) % 1;
    var r2 = 14 + f2 * f2 * maxR;
    tctx.strokeStyle = "rgba(168,85,247,0.5)";
    tctx.lineWidth = 1.5;
    var w2 = r2 * 1.25, h2 = r2 * 0.62;
    tctx.beginPath();
    tctx.moveTo(-w2, -h2*0.4); tctx.lineTo(0, h2*0.5); tctx.lineTo(w2, -h2*0.4);
    tctx.stroke();
    tctx.restore();

    // Lichtpartikel, in den Tunnel gesogen
    tctx.save();
    tctx.translate(cx, cy);
    tctx.globalCompositeOperation = "screen";
    for(var p=0;p<particles.length;p++){
      var pt = particles[p];
      pt.rad -= pt.speed;
      pt.life = Math.max(0, pt.rad / (Math.max(W,H)*0.5));
      var x = Math.cos(pt.ang) * pt.rad;
      var y = Math.sin(pt.ang) * pt.rad * 0.62;
      var pa = Math.min(1, pt.life) * tunnelAlpha;
      tctx.fillStyle = "rgba(150,235,255," + pa.toFixed(3) + ")";
      var s = 1 + (1 - pt.life) * 2;
      tctx.beginPath();
      tctx.arc(x, y, s, 0, Math.PI*2);
      tctx.fill();
      if(pt.rad < 8) particles.splice(p--, 1);
    }
    tctx.restore();
    tctx.restore();
  }

  // ---------- Grain (Noise-Canvas) ----------
  var grainFrames = [];
  var grainIdx = 0;
  function buildGrain(){
    grainFrames = [];
    var gw = Math.max(2, Math.floor(W/3));
    var gh = Math.max(2, Math.floor(H/3));
    grain.width = gw; grain.height = gh;
    grain.style.width = W + "px";
    grain.style.height = H + "px";
    for(var f=0; f<3; f++){
      var img = gctx.createImageData(gw, gh);
      var d = img.data;
      for(var i=0;i<d.length;i+=4){
        var v = (Math.random()*255)|0;
        d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
      }
      grainFrames.push(img);
    }
  }
  function drawGrain(){
    if(!grainFrames.length) return;
    gctx.putImageData(grainFrames[grainIdx], 0, 0);
  }

  // ---------- Choreografie / Timeline ----------
  var startT = 0;
  var rafId = null;
  var counterTarget = 247;
  var counterVal = 247;
  var counterMode = "idle"; // idle | down | suck | up | done
  var scanlineEl = document.querySelector(".scanlines");

  // Zeitpunkte (ms)
  var T = {
    bootEnd: 800,
    accuseStart: 800,
    line: [800, 1280, 1760],   // Einschlag je Zeile
    counterDownStart: 1100,
    riftStart: 2200,
    suckStart: 2300,
    upEnd: 2600,
    dropStart: 2600
  };

  var fired = {};
  function fire(key, fn){ if(!fired[key]){ fired[key]=true; fn(); } }

  function fmt(n){
    return Math.round(n).toLocaleString("de-DE");
  }

  function hitLine(idx, flicker){
    var el = els.lines[idx];
    el.style.transition = "transform .26s cubic-bezier(.2,1.2,.3,1), opacity .2s";
    el.style.opacity = "1";
    el.style.transform = "skewX(-7deg) translateX(0)";
    el.classList.add("chroma");
    // Hero-Zuck (Datamosh)
    hero.classList.remove("shake"); void hero.offsetWidth; hero.classList.add("shake");
    // Scanline-Roll Puls
    if(flicker) el.classList.add("in");
  }
  function presetLine(idx){
    var el = els.lines[idx];
    el.style.transform = "skewX(-7deg) translateX(-26px)";
  }

  function openRift(){
    els.riftL.style.transition = "transform .4s cubic-bezier(.3,.7,.2,1), opacity .25s";
    els.riftR.style.transition = "transform .4s cubic-bezier(.3,.7,.2,1), opacity .25s";
    els.riftL.style.opacity = "1";
    els.riftR.style.opacity = "1";
    els.riftL.style.transform = "translateX(-8px)";
    els.riftR.style.transform = "translateX(8px)";
    els.riftEdge.style.transition = "opacity .3s";
    els.riftEdge.style.opacity = "1";
  }

  function showDrop(){
    els.drop.style.transition = "transform .34s cubic-bezier(.2,1.3,.35,1), opacity .3s";
    els.drop.style.transform = "scale(1)";
    els.drop.style.opacity = "1";
    // Strip + CTA gestaffelt
    setTimeout(function(){
      els.strip.style.transition = "opacity .4s";
      els.strip.style.opacity = "1";
    }, 180);
    setTimeout(function(){
      els.cta.style.transition = "opacity .4s";
      els.cta.style.opacity = "1";
    }, 320);
  }

  // Avatar-Puls-Welle
  var lastPulse = -9999;
  function pulseStrip(now){
    if(els.strip.style.opacity !== "1") return;
    if(now - lastPulse < 3500) return;
    lastPulse = now;
    var stripW = els.strip.clientWidth;
    els.stripPulse.style.transition = "none";
    els.stripPulse.style.opacity = "1";
    els.stripPulse.style.transform = "translate(-100%,-50%)";
    void els.stripPulse.offsetWidth;
    els.stripPulse.style.transition = "transform 2.4s linear, opacity .3s";
    els.stripPulse.style.transform = "translate(" + (stripW+70) + "px,-50%)";
    setTimeout(function(){ els.stripPulse.style.opacity = "0"; }, 2200);
    // Avatare nacheinander zuenden
    for(var i=0;i<avatars.length;i++){
      (function(a, d){
        setTimeout(function(){
          a.classList.add("hit");
          setTimeout(function(){ a.classList.remove("hit"); }, 360);
        }, d);
      })(avatars[i], (i / avatars.length) * 2200);
    }
  }

  // ---------- End-State (sofort, fuer reduced-motion oder als Stabilitaet) ----------
  function setEndState(){
    els.boot.style.opacity = "0";
    els.tracking.style.opacity = "0";
    els.flash.style.opacity = "0";
    els.lines.forEach(function(el){
      el.style.opacity = "1";
      el.style.transform = "skewX(-7deg)";
      el.classList.add("chroma");
    });
    els.counter.style.opacity = "1";
    els.counter.classList.add("up");
    els.cVal.textContent = "1.480";
    counterVal = 1480; counterTarget = 1480; counterMode = "done";
    els.riftL.style.opacity = "1"; els.riftR.style.opacity = "1";
    els.riftL.style.transform = "translateX(-8px)";
    els.riftR.style.transform = "translateX(8px)";
    els.riftEdge.style.opacity = "1";
    els.drop.style.opacity = "1"; els.drop.style.transform = "scale(1)";
    els.strip.style.opacity = "1";
    els.cta.style.opacity = "1";
    tunnelAlpha = 1;
  }

  // ---------- Reset / Replay ----------
  function reset(){
    fired = {};
    counterVal = 247; counterTarget = 247; counterMode = "idle";
    tunnelAlpha = 0;
    particles = [];
    els.cVal.textContent = "247";
    els.counter.classList.remove("up");
    els.counter.style.opacity = "0";
    els.cArrow.style.opacity = "0";
    els.boot.style.transition = "none"; els.boot.style.opacity = "1";
    els.tracking.style.transition = "none"; els.tracking.style.opacity = "0";
    els.tracking.style.transform = "translateY(120%)";
    els.flash.style.transition = "none"; els.flash.style.opacity = "0";
    els.drop.style.transition = "none";
    els.drop.style.opacity = "0"; els.drop.style.transform = "scale(1.08)";
    els.strip.style.transition = "none"; els.strip.style.opacity = "0";
    els.cta.style.transition = "none"; els.cta.style.opacity = "0";
    els.riftL.style.transition = "none"; els.riftL.style.opacity = "0"; els.riftL.style.transform = "translateX(0)";
    els.riftR.style.transition = "none"; els.riftR.style.opacity = "0"; els.riftR.style.transform = "translateX(0)";
    els.riftEdge.style.transition = "none"; els.riftEdge.style.opacity = "0";
    els.lines.forEach(function(el, i){
      el.style.transition = "none";
      el.style.opacity = "0";
      el.classList.remove("chroma","in");
      presetLine(i);
    });
    lastPulse = -9999;
    avatars.forEach(function(a){ a.classList.remove("hit"); });
  }

  function start(){
    reset();
    if(reduce){ setEndState(); resize(); drawTunnel(0); return; }
    // Force-Reflow damit "none"-Transitions sauber zuruecksetzen
    void hero.offsetWidth;
    startT = performance.now();
  }

  // ---------- Master rAF-Loop ----------
  var paused = false;
  var pauseStamp = 0;
  function loop(now){
    rafId = requestAnimationFrame(loop);
    if(paused) return;

    var t = now - startT;

    // --- Boot: VHS-Tracking + Einschalt-Overshoot ---
    if(!reduce){
      if(t < T.bootEnd){
        var bp = t / T.bootEnd;
        // Tracking-Streifen wischt von unten nach oben
        var ty = 120 - bp * 150; // %
        els.tracking.style.opacity = (bp < 0.92 ? 0.9 : 0);
        els.tracking.style.transform = "translateY(" + ty + "%)";
        // Sync-Wackeln
        var jitter = Math.sin(t*0.7) * (1 - bp) * 3;
        hero.style.transform = "translateX(" + jitter.toFixed(2) + "px)";
        // Boot-Schwarz lueftet
        els.boot.style.opacity = (1 - bp).toFixed(3);
      } else {
        fire("bootDone", function(){
          els.tracking.style.opacity = "0";
          els.boot.style.opacity = "0";
          hero.style.transform = "translateX(0)";
          // Helligkeits-Overshoot
          els.flash.style.transition = "none";
          els.flash.style.opacity = "0.85";
          void els.flash.offsetWidth;
          els.flash.style.transition = "opacity .5s ease-out";
          els.flash.style.opacity = "0";
          els.counter.style.opacity = "1";
        });
      }

      // --- Anklage: Zeilen-Einschlag ---
      if(t >= T.line[0]) fire("l0", function(){ hitLine(0, false); });
      if(t >= T.line[1]) fire("l1", function(){ hitLine(1, false); });
      if(t >= T.line[2]) fire("l2", function(){ hitLine(2, true); });

      // --- Counter rueckwaerts (247 -> 244) ---
      if(t >= T.counterDownStart && counterMode === "idle"){ counterMode = "down"; }
      if(counterMode === "down"){
        if(counterVal > 244 && Math.random() < 0.06){
          counterVal -= 1;
          els.cVal.textContent = fmt(counterVal);
        }
      }

      // --- Riss + Sog ---
      if(t >= T.riftStart){
        fire("rift", function(){ openRift(); });
        tunnelAlpha = Math.min(1, tunnelAlpha + 0.06);
      }
      if(t >= T.suckStart && counterMode !== "up" && counterMode !== "done"){
        fire("suck", function(){
          counterMode = "suck";
          // Lichtpartikel-Saugen + Counter dreht
          for(var i=0;i<(isMobile?16:30);i++) spawnParticle();
        });
      }
      if(counterMode === "suck"){
        // kurz pausiert, dann hoch
        if(t >= T.suckStart + 120){
          counterMode = "up";
          counterTarget = 1480;
          els.counter.classList.add("up");
          els.cArrow.style.opacity = "1";
        }
      }
      if(counterMode === "up"){
        counterVal += (counterTarget - counterVal) * 0.14;
        if(counterTarget - counterVal < 1){ counterVal = counterTarget; counterMode = "done"; }
        els.cVal.textContent = fmt(counterVal);
      }

      // --- Drop ---
      if(t >= T.dropStart) fire("drop", function(){ showDrop(); });
    }

    // --- Dauer-Effekte ---
    ringPhase = (ringPhase + 0.0016) % 1;
    if(tunnelAlpha > 0 && Math.random() < (counterMode==="suck"||counterMode==="up"?0.5:0.08)) spawnParticle();
    drawTunnel(now);

    // Grain (alle ~3 Frames durchtauschen)
    if((now|0) % 3 === 0){ grainIdx = (grainIdx + 1) % grainFrames.length; drawGrain(); }

    // Scanline-Drift
    var sy = (now * 0.02) % 4;
    scanlineEl.style.transform = "translateY(" + sy.toFixed(2) + "px)";

    // Marquee
    if(marqWidth === 0 && els.marquee.firstChild){
      marqWidth = els.marquee.scrollWidth / 6;
    }
    marqOffset = (marqOffset + 0.4);
    if(marqWidth > 0 && marqOffset >= marqWidth) marqOffset -= marqWidth;
    els.marquee.style.transform = "translateX(" + (-marqOffset).toFixed(1) + "px)";

    // Avatar-Puls
    pulseStrip(now);
  }

  // ---------- Init ----------
  function init(){
    resize();
    if(reduce){
      setEndState();
      drawGrain();
      drawTunnel(0);
      // Marquee einmal positionieren
      if(els.marquee.firstChild) marqWidth = els.marquee.scrollWidth / 6;
      return;
    }
    start();
    rafId = requestAnimationFrame(loop);
  }

  // Pause bei verstecktem Tab
  document.addEventListener("visibilitychange", function(){
    if(reduce) return;
    if(document.hidden){
      paused = true;
      pauseStamp = performance.now();
    } else if(paused){
      // verbrachte Pausenzeit aus der Timeline herausrechnen -> sauberes Weiterlaufen
      startT += performance.now() - pauseStamp;
      paused = false;
    }
  });

  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      isMobile = window.matchMedia("(max-width:640px)").matches;
      marqWidth = 0;
      resize();
    }, 150);
  });

  document.getElementById("replay").addEventListener("click", function(){
    if(reduce){ return; }
    start();
  });

  init();
})();
</script>
</body>
</html>
