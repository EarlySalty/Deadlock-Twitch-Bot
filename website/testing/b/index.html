<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Der Schwarm trägt dich</title>
<style>
@font-face{font-family:"Sora";font-style:normal;font-weight:700 800;font-display:swap;src:url("/testing/fonts/sora-latin.woff2") format("woff2");}
@font-face{font-family:"Manrope";font-style:normal;font-weight:400 700;font-display:swap;src:url("/testing/fonts/manrope-latin.woff2") format("woff2");}

:root{
  --bg:#07151d; --text:#e9f1f7; --muted:#9bb3c5;
  --cyan:#06B6D4; --violet:#A855F7; --orange:#ff7a18;
  --teal:#10b7ad; --magenta:#ff2f7e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Manrope",system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  overflow:hidden;
}

.hero{
  position:relative;
  min-height:100vh; width:100%;
  overflow:hidden;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
}

#swarm{
  position:absolute; inset:0;
  width:100%; height:100%;
  display:block;
  z-index:1;
}

/* Sanfter Vignetten-Rahmen, damit die kalten Ränder ins Navy faden */
.vignette{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 48%, transparent 38%, rgba(7,21,29,0.55) 78%, rgba(7,21,29,0.92) 100%);
}

.content{
  position:relative; z-index:3;
  width:min(920px, 90vw);
  text-align:center;
  padding:24px;
  pointer-events:none; /* Klicks gehen ans Canvas, außer CTAs */
}

.eyebrow{
  font-family:"Manrope",sans-serif; font-weight:700;
  font-size:clamp(11px,1.3vw,13px);
  letter-spacing:.32em; text-transform:uppercase;
  color:var(--muted);
  opacity:0; transform:translateY(8px);
}

.headline{
  font-family:"Sora",sans-serif; font-weight:800;
  font-size:clamp(34px,6.4vw,76px);
  line-height:1.02; letter-spacing:-0.02em;
  color:var(--text);
  margin:14px 0 0;
  text-wrap:balance;
  text-shadow:0 4px 40px rgba(7,21,29,0.9);
}
.headline .swap{ position:relative; display:inline-block; }
/* Wort-Hardcut: zwei Lagen am selben Platz, harter Wechsel ohne Crossfade */
.headline .cut{
  display:inline-block;
  opacity:0;
}
.headline .cut.solo{ color:var(--muted); }
.headline .cut.join{
  color:transparent;
  background:linear-gradient(96deg,var(--cyan),var(--teal) 55%,var(--orange));
  -webkit-background-clip:text; background-clip:text;
}

.subline{
  font-family:"Manrope",sans-serif; font-weight:400;
  font-size:clamp(15px,2vw,21px);
  line-height:1.5; color:var(--muted);
  max-width:620px; margin:22px auto 0;
  opacity:0; transform:translateY(10px);
  text-wrap:balance;
}
.subline b{ color:var(--text); font-weight:700; }

.cta-row{
  display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
  margin-top:34px;
}
.cta{
  pointer-events:auto;
  font-family:"Sora",sans-serif; font-weight:700;
  font-size:clamp(14px,1.6vw,16px);
  text-decoration:none; cursor:pointer;
  padding:14px 26px; border-radius:999px;
  border:1px solid transparent;
  opacity:0; transform:translateY(12px);
  transition:transform .18s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
}
.cta-primary{
  color:#0b0f12;
  background:linear-gradient(98deg,var(--orange),#ff9a3d);
  box-shadow:0 10px 34px rgba(255,122,24,0.32);
}
.cta-primary:hover{ transform:translateY(-2px); box-shadow:0 16px 44px rgba(255,122,24,0.46); }
.cta-ghost{
  color:var(--text);
  border-color:rgba(155,179,197,0.28);
  background:rgba(7,21,29,0.4);
}
.cta-ghost:hover{ border-color:var(--cyan); transform:translateY(-2px); }

.replay{
  position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
  z-index:4; pointer-events:auto;
  font-family:"Manrope",sans-serif; font-weight:700;
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); background:rgba(7,21,29,0.5);
  border:1px solid rgba(155,179,197,0.2); border-radius:999px;
  padding:8px 16px; cursor:pointer;
  transition:color .2s, border-color .2s, background .2s;
}
.replay:hover{ color:var(--text); border-color:var(--cyan); background:rgba(7,21,29,0.75); }

/* Einblend-Klassen vom Skript getriggert */
.is-in{ opacity:1 !important; transform:translateY(0) !important;
  transition:opacity .7s ease, transform .7s cubic-bezier(.22,.61,.36,1); }
.cut.show{ opacity:1; }

@media (prefers-reduced-motion: reduce){
  .eyebrow,.subline,.cta,.headline .cut{ transition:none !important; }
}
</style>
</head>
<body>
<div class="hero" aria-label="Animierter Schwarm-Hintergrund">
  <canvas id="swarm" aria-hidden="true"></canvas>
  <div class="vignette"></div>

  <div class="content">
    <p class="eyebrow" id="eyebrow">Deadlock Streamer-Netzwerk</p>
    <h1 class="headline">
      <span id="head-line1" class="swap"></span>
      <br/>
      <span class="swap" id="head-line2">
        <span class="cut solo" id="cut-solo">Niemand.</span>
        <span class="cut join" id="cut-join">— oder Teil von uns.</span>
      </span>
    </h1>
    <p class="subline" id="subline">
      Endet dein Stream, <b>trägt der Schwarm deine Zuschauer weiter</b>.
    </p>
    <div class="cta-row">
      <a class="cta cta-primary" id="cta1" href="#start">Schwarm beitreten</a>
      <a class="cta cta-ghost" id="cta2" href="#how">So funktioniert es</a>
    </div>
  </div>

  <button class="replay" id="replay" type="button" aria-label="Animation neu starten">&#8635; Replay</button>
</div>

<script>
(function(){
  "use strict";

  /* Headline-Zeile 1 wird per JS gesetzt, damit der Span beim Replay sauber neu animiert */
  var headLine1 = document.getElementById("head-line1");
  headLine1.textContent = "Allein? Einer von tausend.";

  /* ---------- Setup ---------- */
  var canvas = document.getElementById("swarm");
  var ctx = canvas.getContext("2d", { alpha:false });
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, minDim = 0;
  var isMobile = false;

  /* Marken-Palette für die kalte Masse: Cyan dominiert, sparsam Teal/Violet als Tiefe */
  var COLD = [
    [6, 182, 212],    // cyan
    [16, 183, 173],   // teal
    [120, 170, 220],  // kühles blau-grau
    [168, 85, 247]    // violet (selten)
  ];
  var WARM = [255, 122, 24]; // deine Zelle

  function pickCold(){
    var r = Math.random();
    if (r < 0.62) return COLD[0];
    if (r < 0.82) return COLD[1];
    if (r < 0.95) return COLD[2];
    return COLD[3];
  }

  /* ---------- Boid-Speicher (typed arrays für Tempo) ---------- */
  var MAX = 900;
  var N = 900;            // aktive Anzahl, je nach Viewport
  var px = new Float32Array(MAX), py = new Float32Array(MAX);
  var vx = new Float32Array(MAX), vy = new Float32Array(MAX);
  var cr = new Uint8Array(MAX), cg = new Uint8Array(MAX), cb = new Uint8Array(MAX);
  var sz = new Float32Array(MAX);      // Punktradius
  var active = new Uint8Array(MAX);    // ist im Spiel sichtbar
  var spawnDelay = new Float32Array(MAX); // ab welcher Zeit (s) der Boid einströmt

  /* Du = ein eigenes, separat gerendertes Boid */
  var me = { x:0, y:0, vx:0, vy:0 };

  /* ---------- Spatial-Grid ---------- */
  var cell = 64;          // ~ Wahrnehmungsradius
  var cols = 1, rows = 1;
  var gridHead, gridNext;

  function buildGridStorage(){
    gridHead = new Int32Array(cols * rows);
    gridNext = new Int32Array(MAX);
  }

  function rebuildGrid(){
    gridHead.fill(-1);
    for (var i=0;i<N;i++){
      if (!active[i]) continue;
      var c = ((py[i]/cell)|0)*cols + ((px[i]/cell)|0);
      if (c < 0) c = 0; else if (c >= gridHead.length) c = gridHead.length-1;
      gridNext[i] = gridHead[c];
      gridHead[c] = i;
    }
  }

  /* ---------- Geometrie / Resize ---------- */
  function resize(){
    var r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W * 0.5; CY = H * 0.5;
    minDim = Math.min(W, H);

    isMobile = W < 760;
    N = isMobile ? 350 : 900;

    cell = Math.max(46, Math.round(minDim / 13));
    cols = Math.max(1, Math.ceil(W / cell));
    rows = Math.max(1, Math.ceil(H / cell));
    buildGridStorage();
  }

  /* ---------- Boids initialisieren ---------- */
  function seedBoids(){
    for (var i=0;i<MAX;i++){
      var col = pickCold();
      cr[i]=col[0]; cg[i]=col[1]; cb[i]=col[2];
      sz[i] = 0.9 + Math.random()*1.5;

      if (i < 40){
        // Phase 1: ~40 Punkte sind von Anfang an da, driften ziellos in der Nähe
        active[i] = 1;
        spawnDelay[i] = 0;
        var ang = Math.random()*Math.PI*2;
        var rad = minDim * (0.12 + Math.random()*0.34);
        px[i] = CX + Math.cos(ang)*rad;
        py[i] = CY + Math.sin(ang)*rad;
        var sp = 0.15 + Math.random()*0.3;
        var d = Math.random()*Math.PI*2;
        vx[i] = Math.cos(d)*sp; vy[i] = Math.sin(d)*sp;
      } else {
        // Rest: wartet außerhalb des Viewports, strömt in der SOG-Phase herein
        active[i] = 0;
        // gestaffelter Eintritt zwischen 1.5s und 3.4s
        spawnDelay[i] = 1.5 + Math.random()*1.9;
        placeOffscreen(i);
      }
    }
    me.x = CX; me.y = CY; me.vx = 0; me.vy = 0;
  }

  function placeOffscreen(i){
    // Spawn knapp außerhalb eines der vier Ränder, Velocity Richtung Center
    var edge = (Math.random()*4)|0;
    var m = 60;
    if (edge === 0){ px[i] = -m - Math.random()*120; py[i] = Math.random()*H; }
    else if (edge === 1){ px[i] = W + m + Math.random()*120; py[i] = Math.random()*H; }
    else if (edge === 2){ px[i] = Math.random()*W; py[i] = -m - Math.random()*120; }
    else { px[i] = Math.random()*W; py[i] = H + m + Math.random()*120; }
    var dx = CX - px[i], dy = CY - py[i];
    var dl = Math.hypot(dx,dy) || 1;
    var sp = 1.6 + Math.random()*1.4;
    vx[i] = (dx/dl)*sp; vy[i] = (dy/dl)*sp;
  }

  /* ---------- Timeline ---------- */
  var startT = 0;
  var T = 0;             // Sekunden seit Start
  var lastFrame = 0;
  var rafId = 0;
  var running = false;

  // Choreografie-Marken (s)
  var P_SOG = 1.5, P_FORM = 3.5, P_LOOP = 5.0;

  function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smooth(a,b,t){ t = clamp01((t-a)/(b-a)); return t*t*(3-2*t); }

  /* Kräfte-Gewichte, über die Timeline interpoliert */
  var wForm = { cohesion:0, inflow:0, vortex:0, align:0, sep:0 };

  function updateWeights(){
    // Vereinzelung -> Sog -> Formung -> Loop
    var sog  = smooth(P_SOG, P_FORM, T);    // 0..1 zwischen 1.5 und 3.5
    var form = smooth(P_FORM, P_LOOP, T);   // 0..1 zwischen 3.5 und 5.0
    var loop = T >= P_LOOP ? 1 : 0;

    // Separation immer aktiv, leicht ansteigend
    wForm.sep = 0.6 + 0.4*sog;
    // Alignment/Cohesion greifen erst, wenn die Masse da ist
    wForm.align    = 0.15 + 0.85*sog;
    wForm.cohesion = 0.10 + 0.55*sog + 0.15*form;
    // Inflow: Drang zum Center während Sog, danach abklingend
    wForm.inflow   = 0.9*sog * (1 - 0.7*form);
    // Vortex: erst in der Formung, bleibt im Loop bestehen
    wForm.vortex   = (0.85*form) + (loop ? 0.0 : 0.0);
  }

  /* ---------- Events: Herzschlag, Außenseiter, Adoption ---------- */
  var ripple = { active:false, r:0, t:0 };     // radialer Impuls vom Center
  var nextRipple = 0;
  var nextLoner = 0;
  var lonerIdx = -1;                            // einzeln einströmender Außenseiter
  var tethers = [];                            // {idx, t} Mini-Links an dich

  // Maus-Repulsion
  var mouse = { x:-9999, y:-9999, on:false };

  function onMove(e){
    var r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    mouse.on = true;
  }
  function onLeave(){ mouse.on = false; mouse.x = -9999; mouse.y = -9999; }

  function triggerRipple(){
    ripple.active = true; ripple.r = 0; ripple.t = 0;
  }

  function spawnLoner(){
    // einen inaktiven Boid als einsamen Außenseiter vom Rand schicken
    for (var i=40;i<N;i++){
      if (!active[i]){
        lonerIdx = i;
        active[i] = 1;
        placeOffscreen(i);
        // langsamer, einsamer Drift statt Sog-Tempo
        var dx = CX - px[i], dy = CY - py[i], dl = Math.hypot(dx,dy)||1;
        var sp = 0.7;
        vx[i] = (dx/dl)*sp; vy[i] = (dy/dl)*sp;
        cr[i]=COLD[2][0]; cg[i]=COLD[2][1]; cb[i]=COLD[2][2];
        sz[i] = 1.8;
        return;
      }
    }
  }

  /* ---------- Physik-Schritt ---------- */
  function step(dt){
    updateWeights();

    var percR2 = cell*cell;          // Wahrnehmung^2
    var sepR = cell*0.42, sepR2 = sepR*sepR;
    var maxSpeed = 2.6;
    var phase = T;

    // Aktivierung gestaffelter Sog-Boids
    for (var a=40;a<N;a++){
      if (!active[a] && spawnDelay[a] > 0 && phase >= spawnDelay[a]){
        active[a] = 1;
      }
    }

    rebuildGrid();

    // Maus-Repulsionsradius
    var repR = minDim*0.12, repR2 = repR*repR;

    for (var i=0;i<N;i++){
      if (!active[i]) continue;

      var x = px[i], y = py[i];
      var avx=0, avy=0, cxs=0, cys=0, sepx=0, sepy=0, cnt=0, scnt=0;

      // Nachbarn über 3x3 Grid-Zellen
      var gc = (x/cell)|0, gr = (y/cell)|0;
      for (var oy=-1;oy<=1;oy++){
        var ry = gr+oy; if (ry<0||ry>=rows) continue;
        for (var ox=-1;ox<=1;ox++){
          var rx = gc+ox; if (rx<0||rx>=cols) continue;
          var head = gridHead[ry*cols+rx];
          while (head !== -1){
            if (head !== i){
              var ddx = px[head]-x, ddy = py[head]-y;
              var d2 = ddx*ddx+ddy*ddy;
              if (d2 < percR2){
                avx += vx[head]; avy += vy[head];   // alignment
                cxs += px[head]; cys += py[head];   // cohesion
                cnt++;
                if (d2 < sepR2 && d2 > 0.0001){
                  var inv = 1/Math.sqrt(d2);
                  sepx -= ddx*inv; sepy -= ddy*inv;  // separation
                  scnt++;
                }
              }
            }
            head = gridNext[head];
          }
        }
      }

      var ax=0, ay=0;

      if (cnt > 0){
        // Alignment
        avx/=cnt; avy/=cnt;
        ax += (avx - vx[i]) * 0.05 * wForm.align;
        ay += (avy - vy[i]) * 0.05 * wForm.align;
        // Cohesion
        cxs/=cnt; cys/=cnt;
        ax += (cxs - x) * 0.0009 * wForm.cohesion;
        ay += (cys - y) * 0.0009 * wForm.cohesion;
      }
      if (scnt > 0){
        ax += (sepx/scnt) * 0.55 * wForm.sep;
        ay += (sepy/scnt) * 0.55 * wForm.sep;
      }

      // Inflow: Sog zum Center
      var tdx = CX - x, tdy = CY - y;
      var tdist = Math.hypot(tdx,tdy) || 1;
      if (wForm.inflow > 0){
        ax += (tdx/tdist) * wForm.inflow * 0.06;
        ay += (tdy/tdist) * wForm.inflow * 0.06;
      }

      // Vortex: toroidaler Wirbel = Tangentialkraft + schwache Zentripetalkraft,
      // gepolt auf einen Ringradius, damit ein Torus statt einer Scheibe entsteht
      if (wForm.vortex > 0){
        var nx = tdx/tdist, ny = tdy/tdist;     // Richtung zum Center
        // Tangente (senkrecht), Drehung gegen den Uhrzeigersinn
        var tx = -ny, ty = nx;
        ax += tx * wForm.vortex * 0.9;
        ay += ty * wForm.vortex * 0.9;
        // Ring-Halten: zieht zur Soll-Distanz (Toroid-Atmen über breathe)
        var ringR = minDim * (0.20 + 0.02*Math.sin(phase*0.6));
        var ringErr = tdist - ringR;
        ax += (tdx/tdist) * ringErr * 0.0016 * wForm.vortex;
        ay += (tdy/tdist) * ringErr * 0.0016 * wForm.vortex;
      }

      // Maus-Repulsion (lokaler Ausweich-Flock)
      if (mouse.on){
        var mdx = x - mouse.x, mdy = y - mouse.y;
        var md2 = mdx*mdx + mdy*mdy;
        if (md2 < repR2 && md2 > 0.01){
          var mf = (1 - md2/repR2);
          var minv = 1/Math.sqrt(md2);
          ax += mdx*minv * mf * 2.4;
          ay += mdy*minv * mf * 2.4;
        }
      }

      // Herzschlag-Ripple: radialer Schub nach außen an der Wellenfront
      if (ripple.active){
        var rdiff = tdist - ripple.r;
        if (Math.abs(rdiff) < 46){
          var push = (1 - Math.abs(rdiff)/46) * ripple.t;
          ax += (-tdx/tdist) * push * 1.6;
          ay += (-tdy/tdist) * push * 1.6;
        }
      }

      // Integration
      vx[i] += ax; vy[i] += ay;

      // leichte Dämpfung, hilft beim ruhigen Atmen
      vx[i] *= 0.985; vy[i] *= 0.985;

      var sp2 = vx[i]*vx[i] + vy[i]*vy[i];
      if (sp2 > maxSpeed*maxSpeed){
        var s = maxSpeed/Math.sqrt(sp2);
        vx[i]*=s; vy[i]*=s;
      }

      px[i] += vx[i]; py[i] += vy[i];

      // Weiche Bande nur im Loop, damit nichts verloren geht
      if (phase >= P_SOG){
        var pad = 30;
        if (px[i] < -pad) px[i] = -pad, vx[i] = Math.abs(vx[i])*0.6;
        else if (px[i] > W+pad) px[i] = W+pad, vx[i] = -Math.abs(vx[i])*0.6;
        if (py[i] < -pad) py[i] = -pad, vy[i] = Math.abs(vy[i])*0.6;
        else if (py[i] > H+pad) py[i] = H+pad, vy[i] = -Math.abs(vy[i])*0.6;
      }
    }

    // Ripple-Fortschritt
    if (ripple.active){
      ripple.r += 320 * dt;
      ripple.t = clamp01(1 - ripple.r/(minDim*0.7));
      if (ripple.r > minDim*0.72){ ripple.active = false; }
    }

    // Deine Zelle: Phase 1 mittig pulsend, ab Formung in den Kern gesogen
    updateMe(dt);

    // Außenseiter-Absorption: wenn der Loner nah am Kern ist, färbt er um (wird Teil)
    if (lonerIdx >= 0 && active[lonerIdx]){
      var lx = px[lonerIdx]-CX, ly = py[lonerIdx]-CY;
      var ld = Math.hypot(lx,ly);
      if (ld < minDim*0.22){
        // sanft in Schwarmfarbe überblenden
        cr[lonerIdx] = (cr[lonerIdx]*0.94 + COLD[0][0]*0.06)|0;
        cg[lonerIdx] = (cg[lonerIdx]*0.94 + COLD[0][1]*0.06)|0;
        cb[lonerIdx] = (cb[lonerIdx]*0.94 + COLD[0][2]*0.06)|0;
        if (sz[lonerIdx] > 1.1) sz[lonerIdx] *= 0.99;
        if (ld < minDim*0.16){ lonerIdx = -1; } // ist absorbiert
      }
    }

    // Tether-Lebenszeit runterzählen
    for (var t=tethers.length-1;t>=0;t--){
      tethers[t].t -= dt;
      if (tethers[t].t <= 0) tethers.splice(t,1);
    }
  }

  function updateMe(dt){
    var phase = T;
    if (phase < P_FORM){
      // sitzt allein in der Mitte, leichtes Wandern
      var wobX = Math.sin(phase*1.3)*6;
      var wobY = Math.cos(phase*1.0)*5;
      var tx = CX + wobX, ty = CY + wobY;
      me.vx += (tx - me.x)*0.04;
      me.vy += (ty - me.y)*0.04;
    } else {
      // wird in den hellen Kern gesogen und kreist dann sanft mit
      var pull = smooth(P_FORM, P_LOOP, phase);
      var ang = phase*0.4;
      var rad = minDim * 0.03 * (1-pull) + minDim*0.012;
      var tx2 = CX + Math.cos(ang)*rad;
      var ty2 = CY + Math.sin(ang)*rad;
      me.vx += (tx2 - me.x)*0.05;
      me.vy += (ty2 - me.y)*0.05;
    }
    me.vx *= 0.86; me.vy *= 0.86;
    me.x += me.vx; me.y += me.vy;

    // Adoption: in der Formungsphase tethern ein paar Boids kurz an dich
    if (phase >= P_FORM && phase < P_LOOP && tethers.length < 8 && Math.random() < 0.10){
      var best = -1, bd = 1e9;
      for (var k=0;k<N;k+=7){
        if (!active[k]) continue;
        var dx = px[k]-me.x, dy = py[k]-me.y, d2 = dx*dx+dy*dy;
        if (d2 < bd && d2 < (minDim*0.18)*(minDim*0.18)){ bd = d2; best = k; }
      }
      if (best >= 0){ tethers.push({ idx:best, t:0.5+Math.random()*0.4 }); }
    }
  }

  /* ---------- Rendering ---------- */
  function render(){
    var phase = T;

    // Bewegungsschweif: halbtransparenter Vollflächen-Fill statt clearRect
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(7,21,29,0.18)";
    ctx.fillRect(0,0,W,H);

    // Kern-Glow während/nach der Formung
    var coreA = smooth(P_FORM, P_LOOP, phase);
    if (coreA > 0){
      var pulse = 0.5 + 0.5*Math.sin(phase*1.4);
      var coreR = minDim * (0.10 + 0.012*pulse);
      var g = ctx.createRadialGradient(CX,CY,0, CX,CY,coreR);
      g.addColorStop(0, "rgba(120,210,230,"+(0.20*coreA)+")");
      g.addColorStop(0.5, "rgba(40,120,150,"+(0.10*coreA)+")");
      g.addColorStop(1, "rgba(7,21,29,0)");
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(CX,CY,coreR,0,Math.PI*2); ctx.fill();
    }

    // Additiv: die kalte Masse
    ctx.globalCompositeOperation = "lighter";
    for (var i=0;i<N;i++){
      if (!active[i]) continue;
      var x = px[i], y = py[i], s = sz[i];
      // Helligkeit leicht geschwindigkeitsabhängig -> lebendiges Funkeln
      var spd = Math.min(1, (Math.abs(vx[i])+Math.abs(vy[i]))*0.4);
      var a = 0.30 + 0.45*spd;
      ctx.fillStyle = "rgba("+cr[i]+","+cg[i]+","+cb[i]+","+a.toFixed(3)+")";
      ctx.beginPath();
      ctx.arc(x, y, s, 0, Math.PI*2);
      ctx.fill();
    }

    // Tether-Mini-Links (dünn, kurz) an dich
    if (tethers.length){
      ctx.globalCompositeOperation = "lighter";
      ctx.lineWidth = 1;
      for (var t=0;t<tethers.length;t++){
        var ti = tethers[t];
        if (!active[ti.idx]) continue;
        var la = clamp01(ti.t/0.6) * 0.5;
        ctx.strokeStyle = "rgba(255,150,70,"+la.toFixed(3)+")";
        ctx.beginPath();
        ctx.moveTo(me.x, me.y);
        ctx.lineTo(px[ti.idx], py[ti.idx]);
        ctx.stroke();
      }
    }

    // Ripple-Ring als zarte Welle sichtbar machen
    if (ripple.active && ripple.t > 0.02){
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(120,200,220,"+(0.18*ripple.t).toFixed(3)+")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(CX,CY,ripple.r,0,Math.PI*2);
      ctx.stroke();
    }

    // Du: orange Zelle mit Pulshalo
    drawMe(phase);

    ctx.globalCompositeOperation = "source-over";
  }

  function drawMe(phase){
    var x = me.x, y = me.y;
    // Halo-Intensität: schwach in Phase 1, flammt in der Formung auf
    var base = phase < P_FORM ? (0.5+0.5*Math.sin(phase*2.2)) : 1;
    var formGlow = smooth(P_FORM, P_LOOP, phase);
    var pulse = 0.5 + 0.5*Math.sin(phase*2.6);
    var haloR = minDim * (0.018 + 0.010*pulse) * (0.7 + 0.6*base + 0.7*formGlow);

    ctx.globalCompositeOperation = "lighter";
    var g = ctx.createRadialGradient(x,y,0, x,y,haloR);
    g.addColorStop(0, "rgba(255,150,60,"+(0.55*(0.5+0.5*base)).toFixed(3)+")");
    g.addColorStop(0.4, "rgba(255,122,24,"+(0.30*(0.4+0.6*base)).toFixed(3)+")");
    g.addColorStop(1, "rgba(255,90,10,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,haloR,0,Math.PI*2); ctx.fill();

    // Kern der Zelle
    var coreR = minDim*0.0085 * (0.9+0.25*pulse);
    ctx.fillStyle = "rgba(255,168,90,0.98)";
    ctx.beginPath(); ctx.arc(x,y,coreR,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba("+WARM[0]+","+WARM[1]+","+WARM[2]+",1)";
    ctx.beginPath(); ctx.arc(x,y,coreR*0.6,0,Math.PI*2); ctx.fill();
  }

  /* ---------- Text-Choreografie (HTML-Klassen) ---------- */
  var textState = 0;
  var timeouts = [];

  function clearTimeouts(){
    for (var i=0;i<timeouts.length;i++) clearTimeout(timeouts[i]);
    timeouts = [];
  }

  function show(el){ el.classList.add("is-in"); }
  function hide(el){ el.classList.remove("is-in"); }

  function resetText(){
    clearTimeouts();
    var eyebrow = document.getElementById("eyebrow");
    var sub = document.getElementById("subline");
    var c1 = document.getElementById("cta1");
    var c2 = document.getElementById("cta2");
    var solo = document.getElementById("cut-solo");
    var join = document.getElementById("cut-join");
    headLine1.style.opacity = "0";
    headLine1.style.transform = "translateY(8px)";
    headLine1.style.transition = "none";
    hide(eyebrow); hide(sub); hide(c1); hide(c2);
    solo.classList.remove("show"); join.classList.remove("show");
  }

  function scheduleText(){
    var eyebrow = document.getElementById("eyebrow");
    var sub = document.getElementById("subline");
    var c1 = document.getElementById("cta1");
    var c2 = document.getElementById("cta2");
    var solo = document.getElementById("cut-solo");
    var join = document.getElementById("cut-join");

    // 0.0s: Headline + Eyebrow einsam einblenden
    timeouts.push(setTimeout(function(){
      headLine1.style.transition = "opacity .7s ease, transform .7s cubic-bezier(.22,.61,.36,1)";
      headLine1.style.opacity = "1";
      headLine1.style.transform = "translateY(0)";
      show(eyebrow);
    }, 200));

    // ~2.0s: Wort "Niemand." hart einblenden (SOG läuft)
    timeouts.push(setTimeout(function(){ solo.classList.add("show"); }, 2000));

    // ~3.4s: Hardcut "Niemand." -> "— oder Teil von uns."
    timeouts.push(setTimeout(function(){
      solo.classList.remove("show");
      join.classList.add("show");
    }, 3400));

    // ~4.2s: Subhead auflösen
    timeouts.push(setTimeout(function(){ show(sub); }, 4200));

    // ~4.8s / 5.0s: CTAs steigen ein
    timeouts.push(setTimeout(function(){ show(c1); }, 4800));
    timeouts.push(setTimeout(function(){ show(c2); }, 5000));
  }

  /* ---------- Hauptschleife ---------- */
  function frame(now){
    if (!running) return;
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame)/1000;
    lastFrame = now;
    if (dt > 0.05) dt = 0.05;   // Spikes kappen

    T = (now - startT)/1000;

    // Loop-Ereignisse erst ab lebender Ruhe
    if (T >= P_LOOP){
      if (now >= nextRipple){ triggerRipple(); nextRipple = now + 6000; }
      if (now >= nextLoner){ spawnLoner(); nextLoner = now + 9000; }
    }

    step(dt);
    render();

    rafId = requestAnimationFrame(frame);
  }

  /* ---------- reduced-motion: statischer Endzustand ---------- */
  function renderStaticEnd(){
    // Vortex-Endzustand analytisch setzen: Ring um den Kern, Zelle im Zentrum
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#07151d";
    ctx.fillRect(0,0,W,H);

    var count = N;
    for (var i=0;i<count;i++){
      var ang = (i/count)*Math.PI*2*7 + (i%13)*0.21;
      var ringR = minDim * (0.20 + ((i%5)-2)*0.018) + ((i*37)%minDim)*0.0008;
      var x = CX + Math.cos(ang)*ringR;
      var y = CY + Math.sin(ang)*ringR;
      var col = (i%17===0) ? COLD[3] : (i%5===0 ? COLD[1] : COLD[0]);
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba("+col[0]+","+col[1]+","+col[2]+",0.5)";
      ctx.beginPath(); ctx.arc(x,y, 0.9+ (i%3)*0.5, 0, Math.PI*2); ctx.fill();
    }

    // Kern-Glow
    var g = ctx.createRadialGradient(CX,CY,0, CX,CY,minDim*0.12);
    g.addColorStop(0,"rgba(120,210,230,0.22)");
    g.addColorStop(1,"rgba(7,21,29,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX,CY,minDim*0.12,0,Math.PI*2); ctx.fill();

    // Deine Zelle im Kern
    me.x = CX; me.y = CY;
    var halo = ctx.createRadialGradient(CX,CY,0, CX,CY,minDim*0.04);
    halo.addColorStop(0,"rgba(255,150,60,0.6)");
    halo.addColorStop(1,"rgba(255,90,10,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(CX,CY,minDim*0.04,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,168,90,1)";
    ctx.beginPath(); ctx.arc(CX,CY,minDim*0.009,0,Math.PI*2); ctx.fill();

    ctx.globalCompositeOperation = "source-over";
  }

  function showAllTextStatic(){
    document.getElementById("eyebrow").classList.add("is-in");
    document.getElementById("subline").classList.add("is-in");
    document.getElementById("cta1").classList.add("is-in");
    document.getElementById("cta2").classList.add("is-in");
    document.getElementById("cut-join").classList.add("show");
    headLine1.style.transition = "none";
    headLine1.style.opacity = "1";
    headLine1.style.transform = "none";
  }

  /* ---------- Start / Replay ---------- */
  function start(){
    resize();
    seedBoids();
    ripple.active = false;
    tethers = [];
    lonerIdx = -1;
    mouse.on = false; mouse.x = -9999; mouse.y = -9999;

    if (reduceMotion){
      running = false;
      cancelAnimationFrame(rafId);
      renderStaticEnd();
      showAllTextStatic();
      return;
    }

    // dunkle Bühne für Phase 1 (Vereinzelung)
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#07151d";
    ctx.fillRect(0,0,W,H);

    resetText();
    scheduleText();

    startT = performance.now();
    lastFrame = 0;
    T = 0;
    nextRipple = startT + P_LOOP*1000 + 6000;
    nextLoner  = startT + P_LOOP*1000 + 9000;
    running = true;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }

  /* ---------- Sichtbarkeit / Pause ---------- */
  function onVisibility(){
    if (document.hidden){
      running = false;
      cancelAnimationFrame(rafId);
    } else if (!reduceMotion){
      // ohne Choreografie-Reset weiterlaufen: Zeitbasis nachführen
      if (!running){
        lastFrame = 0;
        // verstrichene Pause aus startT herausrechnen, damit T monoton bleibt
        startT = performance.now() - T*1000;
        running = true;
        rafId = requestAnimationFrame(frame);
      }
    }
  }

  /* ---------- Debounced Resize ---------- */
  var resizeTimer = 0;
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (reduceMotion){
        resize(); renderStaticEnd(); return;
      }
      // weiches Resize: Geometrie neu, Boids behalten relative Lage grob
      resize();
    }, 150);
  }

  /* ---------- Bindings ---------- */
  document.getElementById("replay").addEventListener("click", start);
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("mouseleave", onLeave);
  document.addEventListener("visibilitychange", onVisibility);
  window.addEventListener("resize", onResize);

  // Los
  start();
})();
</script>
</body>
