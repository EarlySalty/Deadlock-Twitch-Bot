<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero-Konzepte — Vergleich A · B · C</title>
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:400 800;font-display:swap;src:url("/testing/fonts/manrope-latin.woff2") format("woff2");}
@font-face{font-family:"Sora";font-style:normal;font-weight:400 800;font-display:swap;src:url("/testing/fonts/sora-latin.woff2") format("woff2");}
:root{--bg:#07151d;--text:#e9f1f7;--muted:#9bb3c5;--cyan:#06B6D4;--orange:#ff7a18;--border:rgba(194,221,240,0.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Manrope",sans-serif;background:var(--bg);color:var(--text);scroll-behavior:smooth}

/* Sticky-Vergleichsnav */
.cmp-nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(7,21,29,0.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.cmp-nav .brand{font-family:"Sora",sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em}
.cmp-nav .spacer{flex:1}
.cmp-nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;border:1px solid transparent;transition:all .2s}
.cmp-nav a:hover{color:var(--text);border-color:var(--border)}

/* Stapel-Sektionen */
.cmp{position:relative;height:100vh;border-bottom:2px solid #0d2230;overflow:hidden;scroll-margin-top:0}
.cmp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.cmp .label{position:absolute;top:54px;left:0;right:0;z-index:5;display:flex;align-items:baseline;gap:12px;
  padding:12px 18px;pointer-events:none}
.cmp .tag{font-family:"Sora",sans-serif;font-weight:800;font-size:26px;line-height:1;
  color:var(--orange);text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cmp .ttl{font-family:"Sora",sans-serif;font-weight:700;font-size:15px;color:var(--text);text-shadow:0 2px 14px rgba(0,0,0,.7)}
.cmp .kind{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.cmp .full{margin-left:auto;pointer-events:auto;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border);border-radius:999px;padding:6px 13px;
  background:rgba(7,21,29,0.6);backdrop-filter:blur(8px);transition:all .2s}
.cmp .full:hover{color:var(--text);border-color:var(--orange)}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-size:14px;letter-spacing:.08em}
</style>
</head>
<body>
  <nav class="cmp-nav">
    <span class="brand">Hero-Konzepte</span>
    <span class="kind" style="color:var(--muted)">scroll = vergleichen</span>
    <span class="spacer"></span>
    <a href="#a">A</a><a href="#b">B</a><a href="#c">C</a>
  </nav>

  <section class="cmp" id="a">
    <div class="label"><span class="tag">A</span><span class="ttl">Einer von vielen → Einer von uns</span><span class="kind">brutal-minimal</span><a class="full" href="/testing/a/index.html" target="_blank" rel="noopener">Vollbild ↗</a></div>
    <div class="placeholder">A wird geladen …</div>
    <iframe data-src="/testing/a/index.html" title="Konzept A" loading="lazy"></iframe>
  </section>

  <section class="cmp" id="b">
    <div class="label"><span class="tag">B</span><span class="ttl">Der Schwarm trägt dich</span><span class="kind">organisch</span><a class="full" href="/testing/b/index.html" target="_blank" rel="noopener">Vollbild ↗</a></div>
    <div class="placeholder">B wird geladen …</div>
    <iframe data-src="/testing/b/index.html" title="Konzept B" loading="lazy"></iframe>
  </section>

  <section class="cmp" id="c">
    <div class="label"><span class="tag">C</span><span class="ttl">Dein Stream stirbt. Deine Viewer nicht.</span><span class="kind">VHS-Phonk-Cover</span><a class="full" href="/testing/c/index.html" target="_blank" rel="noopener">Vollbild ↗</a></div>
    <div class="placeholder">C wird geladen …</div>
    <iframe data-src="/testing/c/index.html" title="Konzept C" loading="lazy"></iframe>
  </section>

  <script>
    // Faul laden: iframe-src erst setzen, wenn die Sektion nah am Viewport ist
    const io=new IntersectionObserver((entries)=>{
      for(const e of entries){
        if(e.isIntersecting){
          const f=e.target.querySelector('iframe[data-src]');
          if(f){ f.src=f.dataset.src; f.removeAttribute('data-src');
            f.addEventListener('load',()=>{ const p=e.target.querySelector('.placeholder'); if(p)p.remove(); }); }
          io.unobserve(e.target);
        }
      }
    },{rootMargin:'200px'});
    document.querySelectorAll('.cmp').forEach(s=>io.observe(s));
  </script>
</body>
</html>
