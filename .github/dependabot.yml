version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # init und analyze muessen dieselbe Version haben, sonst bricht die Analyse
      # mit "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/bot/dashboard_v2"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=10"

  - package-ecosystem: "npm"
    directory: "/bot/admin_dashboard"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
