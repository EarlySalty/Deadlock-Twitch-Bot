name: "Rust Security"

# Rust-CodeQL ist hier kein verlässlicher Ersatz für Clippy und RustSec.
# Derselbe Workflow läuft auf relevanten PRs und weiterhin wöchentlich.
on:
  workflow_call:
  schedule:
    - cron: "38 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    name: "Rust formatting"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check workspace formatting
        working-directory: rust
        run: cargo fmt --all --check

  clippy:
    name: "clippy (deny warnings)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run clippy
        working-directory: rust
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: "cargo-audit (RustSec)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-audit@0.22.2
      # Dieses Arbeitsverzeichnis ist nötig, damit .cargo/audit.toml greift.
      - name: Run cargo-audit
        working-directory: rust
        run: cargo audit

  deny:
    name: "cargo-deny (advisories bans sources)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-deny@0.20.2
      - name: Run cargo-deny
        working-directory: rust
        run: cargo deny check advisories bans sources
