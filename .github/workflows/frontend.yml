name: "Frontend"

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "bot/admin_dashboard/**"
      - "bot/dashboard_v2/**"
      - ".nvmrc"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "bot/admin_dashboard/**"
      - "bot/dashboard_v2/**"
      - ".nvmrc"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "${{ matrix.project }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: website
            dir: website
            lint: false
          - project: admin_dashboard
            dir: bot/admin_dashboard
            lint: false
          - project: dashboard_v2
            dir: bot/dashboard_v2
            lint: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: matrix.lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
