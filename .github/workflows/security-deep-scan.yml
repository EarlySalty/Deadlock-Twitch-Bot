name: "Deep Security Scan"

# Wöchentlich statt bei jedem Push, damit das Actions-Budget reicht.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trivy-scan:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan (strict)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore.yaml'
          exit-code: 1

      - name: Upload Trivy SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-filesystem'

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-report
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 30

  security-scorecard:
    name: OSSF Security Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always() && hashFiles('scorecard-results.sarif') != ''
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scorecard-report
          path: scorecard-results.sarif
          if-no-files-found: ignore
          retention-days: 30

  osv-scan:
    name: OSV Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pipx install semgrep==1.176.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/rust \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/github-actions \
            --config p/javascript \
            --config p/python \
            --metrics=off \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.0
          min-severity: high
          advanced-security: true

  generate-summary:
    name: Summary
    needs: [trivy-scan, security-scorecard, osv-scan, semgrep, zizmor]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "# Security Analysis Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy: ${{ needs.trivy-scan.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSSF Scorecard: ${{ needs.security-scorecard.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSV Scanner: ${{ needs.osv-scan.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Semgrep: ${{ needs.semgrep.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- zizmor: ${{ needs.zizmor.result }}" >> "$GITHUB_STEP_SUMMARY"
