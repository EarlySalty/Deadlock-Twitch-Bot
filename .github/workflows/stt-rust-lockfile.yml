name: "STT Rust Lockfile"

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/stt-rust-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang
      - name: Resolve only new STT dependencies
        run: cd rust && cargo check -j2 -p tb-stt-server
      - name: Test Rust STT server
        run: cd rust && cargo test --locked -j2 -p tb-stt-server
      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
          else
            git commit -m "build(stt): lock native whisper dependencies"
            git fetch origin ${{ github.event.pull_request.head.ref }}
            git rebase origin/${{ github.event.pull_request.head.ref }}
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
