name: "Manifest-Scope"

# PRs rufen diesen Workflow über Required PR CI auf; kein doppelter PR-Lauf.
on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manifest-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-scope:
    name: "Scope-Abgleich (keine toten Projekte)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scope prüfen
        run: python scripts/check_manifest_scope.py
      - name: Tests des Scope-Checks
        run: python -m unittest discover -s tests -p 'test_check_manifest_scope.py' -v
