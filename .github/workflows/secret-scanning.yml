name: "Secret Scanning"

# Woechentlich statt bei jedem Push, damit das Actions-Budget reicht.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Block tracked secret material files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|machine_auth_token\.txt|refresh\.token|oauth_tokens?.*|.*\.pem|.*\.key)$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Tracked secret material files detected:"
            echo "$forbidden"
            exit 1
          fi

      - name: Run Gitleaks (strict)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: true

  trivy-secrets:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy Secret Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          skip-dirs: 'node_modules,.venv,venv,dist,build'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          trivyignores: '.trivyignore.yaml'
          exit-code: 1

      - name: Upload Trivy Secret SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        if: always() && hashFiles('trivy-secrets.sarif') != ''
        with:
          sarif_file: 'trivy-secrets.sarif'
          category: 'trivy-secrets'

      - name: Upload Trivy Secret Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-secret-report
          path: trivy-secrets.sarif
          if-no-files-found: ignore
          retention-days: 30
