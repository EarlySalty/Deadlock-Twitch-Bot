name: "Security"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-files:
    name: "versioned secret files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse versioned secret files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|machine_auth_token\.txt|refresh\.token|oauth_tokens?.*|.*\.pem|.*\.key)$' || true)
          if [ -n "$forbidden" ]; then
            echo "versioned secret files found:"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          echo "no versioned secret files"

  gitleaks:
    name: "gitleaks (secrets)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 2 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --report-format sarif --report-path gitleaks.sarif . || status=$?
          echo "gitleaks exit ${status}"
          echo "GITLEAKS_STATUS=${status}" >> "$GITHUB_ENV"
      - name: Scan current tree
        if: github.event_name != 'pull_request'
        run: |
          status=0
          gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 2 \
            --report-format sarif --report-path gitleaks.sarif . || status=$?
          echo "gitleaks exit ${status}"
          echo "GITLEAKS_STATUS=${status}" >> "$GITHUB_ENV"
      - name: Upload gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Fail on leaked secrets
        run: test "${GITLEAKS_STATUS}" -eq 0

  trivy:
    name: "trivy (deps, secrets, misconfig)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          skip-dirs: node_modules,target,dist,graphify-out,.git,.tasks
          trivyignores: .trivyignore.yaml
          exit-code: "0"
      - name: Upload trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  osv-scanner:
    name: "osv-scanner (all lockfiles)"
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
      fail-on-vuln: false
      upload-sarif: true

  semgrep:
    name: "semgrep CE (SAST)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install --quiet "semgrep==1.173.0"
      - name: Run semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          status=0
          semgrep scan --metrics=off --sarif --output semgrep.sarif \
            --config p/rust --config p/security-audit --config p/owasp-top-ten \
            --config p/github-actions --config p/javascript --config p/typescript --config p/python \
            . || status=$?
          echo "semgrep exit ${status}"
      - name: Upload semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  zizmor:
    name: "zizmor (workflow security)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: true

  actionlint:
    name: "actionlint (workflow syntax)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          1.7.12SION: "ACTIONLINT_VER"
        run: |
          bash <(curl -sSL "https://raw.githubusercontent.com/rhysd/actionlint/v${1.7.12SION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
