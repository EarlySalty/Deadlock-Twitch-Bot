name: "Dependabot Auto Merge"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-open-prs:
    name: "Reconcile open Dependabot PRs"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge open Dependabot PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const dependabotPulls = pulls.filter(
              (pull) => pull.user?.login === "dependabot[bot]" && pull.draft === false,
            );

            for (const pull of dependabotPulls) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              const onlyDependabotCommits =
                commits.length > 0 &&
                commits.every((commit) => commit.author?.login === "dependabot[bot]");
              if (
                pull.head.repo?.full_name !== `${owner}/${repo}` ||
                !pull.head.ref.startsWith("dependabot/") ||
                !onlyDependabotCommits
              ) {
                core.notice(
                  `PR #${pull.number} contains non-Dependabot changes and requires manual review.`,
                );
                continue;
              }

              // Workflow-Aenderungen bleiben bewusst manuell: das GITHUB_TOKEN
              // soll keine privilegierten Workflow-Dateien aus Dependabot-PRs mergen.
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              const touchesWorkflows = files.some((file) =>
                file.filename.startsWith(".github/workflows/"),
              );
              if (touchesWorkflows) {
                core.notice(
                  `PR #${pull.number} modifies workflow files and requires manual merge.`,
                );
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pull.number,
                  merge_method: "squash",
                });
                core.notice(`PR #${pull.number} merged successfully.`);
              } catch (error) {
                core.warning(
                  `Could not merge PR #${pull.number}: ${String(error?.message || error)}`,
                );
              }
            }
