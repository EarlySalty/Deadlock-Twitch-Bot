name: "Dependabot Auto Merge"

# PR-first testbetrieb: Dependabot may continue to create update PRs, but merge
# automation stays paused until a later versioned policy decision re-enables it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-paused:
    name: "Dependabot merge automation paused"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explain merge hold
        run: |
          echo "Dependabot auto-merge is paused during the PR-first testbetrieb."
          echo "Update generation and repository security scans remain active."
