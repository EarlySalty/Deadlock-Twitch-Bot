name: "Dependabot Auto Merge"

# Trusted metadata only. NEVER check out or execute pull-request code here.
on:
  # zizmor exception: trusted metadata only, no checkout/artifact consumption.
  # Immutable bot identity, same-repo head and an enforced gate are mandatory.
  # Review this exception again on 2026-12-22 or any added step/permission.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: "Enable gated Dependabot auto-merge"
    if: >-
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch authenticated Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Require conservative policy and an enforced PR gate
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        with:
          script: |
            core.setOutput('eligible', 'false');
            const permitted = ['version-update:semver-patch', 'version-update:semver-minor'];
            if (!permitted.includes(process.env.UPDATE_TYPE)) {
              core.notice('No automatic major, unknown or unclassified security update.');
              return;
            }
            if (!['npm', 'cargo', 'pip'].includes(process.env.ECOSYSTEM) ||
                process.env.MAINTAINER_CHANGES !== 'false') {
              core.notice('Actions updates and maintainer changes require manual review.');
              return;
            }
            const branch = context.payload.pull_request.base.ref;
            if (branch !== context.payload.repository.default_branch) {
              core.notice('Auto-merge is limited to the default branch.');
              return;
            }
            // --auto can otherwise merge immediately on an unprotected branch.
            // Effective branch rules omit disabled/evaluate-only rulesets.
            const {data: rules} = await github.request(
              'GET /repos/{owner}/{repo}/rules/branches/{branch}',
              {...context.repo, branch}
            );
            const enforced = rules.some(rule =>
              rule.type === 'required_status_checks' &&
              rule.parameters?.strict_required_status_checks_policy === true &&
              rule.parameters?.required_status_checks?.some(check =>
                check.context === 'Required PR Gate' && check.integration_id === 15368
              )
            );
            if (!enforced) {
              core.notice('Auto-merge stays OFF until Required PR Gate is enforced for GitHub Actions.');
              return;
            }
            const {data: current} = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number
            });
            if (current.head.sha !== context.payload.pull_request.head.sha || current.state !== 'open') {
              core.notice('PR head changed; the newer event must re-evaluate eligibility.');
              return;
            }
            core.setOutput('eligible', 'true');

      - name: Enable native auto-merge (never bypass required checks)
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
