name: "Dependabot Auto Merge"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-merge:
    name: "Auto-merge trusted Dependabot updates"
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          alert-lookup: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide eligibility
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        with:
          script: |
            const names = (process.env.DEPENDENCY_NAMES || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const updateType = process.env.UPDATE_TYPE || "";
            const securityUpdate = (process.env.ALERT_STATE || "").toUpperCase() === "OPEN";
            const maintainerChanges = (process.env.MAINTAINER_CHANGES || "").toLowerCase() === "true";
            const ecosystem = process.env.PACKAGE_ECOSYSTEM || "";
            const directory = process.env.DIRECTORY || "";
            const newVersion = process.env.NEW_VERSION || "";

            let shouldMerge = false;
            let reason = "unsupported update type";

            if (maintainerChanges) {
              reason = "maintainer changes detected";
            } else if (securityUpdate) {
              shouldMerge = true;
              reason = "security update";
            } else if (
              updateType.startsWith("version-update:") ||
              names.length > 0
            ) {
              shouldMerge = true;
              reason = updateType || "dependabot version update";
            }

            core.setOutput("should_merge", shouldMerge ? "true" : "false");
            core.setOutput("reason", reason);
            core.notice(`Auto-merge decision: ${shouldMerge} (${reason})`);

      - name: Merge PR
        if: steps.gate.outputs.should_merge == 'true' && github.event.pull_request.draft == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const requiredChecks = [
              "Semantic review",
              "Scope-Abgleich (keine toten Projekte)",
              "Frontend PR Gate (website)",
              "Frontend PR Gate (admin_dashboard)",
              "Frontend PR Gate (dashboard_v2)",
              "Rust SQLx required",
            ];

            const verifyGate = async () => {
              let pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              const evaluatedSha = pr.head.sha;
              const evaluatedBaseSha = pr.base.sha;

              if (pr.base.ref !== "main" || pr.draft || pr.head.repo?.full_name !== `${owner}/${repo}`) {
                return { ready: false, reason: "PR is no longer an eligible same-repository main PR" };
              }

              const comparison = await github.request("GET /repos/{owner}/{repo}/compare/{basehead}", {
                owner,
                repo,
                basehead: `${evaluatedBaseSha}...${evaluatedSha}`,
              });
              if ((comparison.data.behind_by || 0) > 0) {
                return { ready: false, reason: `branch is behind main by ${comparison.data.behind_by}` };
              }
              if (pr.mergeable !== true || pr.mergeable_state === "dirty") {
                return { ready: false, reason: `mergeability is ${pr.mergeable_state || "unknown"}` };
              }

              const checkResponse = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: evaluatedSha,
                filter: "latest",
                per_page: 100,
              });
              const trustedChecks = (checkResponse.data.check_runs || []).filter(
                (check) => check.head_sha === evaluatedSha && check.app?.slug === "github-actions",
              );
              const byName = new Map(trustedChecks.map((check) => [check.name, check]));
              const missing = requiredChecks.filter((name) => !byName.has(name));
              const incomplete = requiredChecks.filter((name) => {
                const check = byName.get(name);
                return check && (check.status !== "completed" || check.conclusion !== "success");
              });
              if (missing.length || incomplete.length) {
                return {
                  ready: false,
                  reason: `required checks not green (missing=${missing.join(",") || "none"}; incomplete=${incomplete.join(",") || "none"})`,
                };
              }

              const accepted = new Set(["success", "neutral", "skipped"]);
              const ignoredOwnChecks = new Set([
                "Auto-merge trusted Dependabot updates",
                "Reconcile open Dependabot PRs",
              ]);
              const blockingChecks = (checkResponse.data.check_runs || []).filter(
                (check) =>
                  check.head_sha === evaluatedSha &&
                  !ignoredOwnChecks.has(check.name) &&
                  (check.status !== "completed" || !accepted.has(check.conclusion || "")),
              );
              if (blockingChecks.length) {
                return {
                  ready: false,
                  reason: `other checks not green: ${blockingChecks.map((check) => `${check.name}=${check.status}/${check.conclusion || "pending"}`).join(", ")}`,
                };
              }

              const statusResponse = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: evaluatedSha,
                per_page: 100,
              });
              const latestByContext = new Map();
              for (const status of statusResponse.data.statuses || []) {
                const previous = latestByContext.get(status.context);
                if (
                  !previous ||
                  new Date(status.created_at || 0).getTime() >
                    new Date(previous.created_at || 0).getTime()
                ) {
                  latestByContext.set(status.context, status);
                }
              }
              const blockingStatuses = [...latestByContext.values()].filter(
                (status) => status.state !== "success",
              );
              if (blockingStatuses.length) {
                return {
                  ready: false,
                  reason: `commit statuses not green: ${blockingStatuses.map((status) => `${status.context}=${status.state}`).join(", ")}`,
                };
              }

              pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              if (pr.head.sha !== evaluatedSha || pr.base.sha !== evaluatedBaseSha) {
                return { ready: false, reason: "head or base changed during gate evaluation" };
              }
              return { ready: true, evaluatedSha };
            };

            for (let attempt = 1; attempt <= 24; attempt += 1) {
              const gate = await verifyGate();
              if (!gate.ready) {
                if (attempt < 24) {
                  core.notice(`PR #${pull_number}: gate not ready on attempt ${attempt}/24: ${gate.reason}; retrying in 15s.`);
                  await sleep(15_000);
                  continue;
                }
                core.notice(`PR #${pull_number}: gate remained closed: ${gate.reason}.`);
                return;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  merge_method: "squash",
                  sha: gate.evaluatedSha,
                });
                core.notice(`PR #${pull_number} merged at verified head ${gate.evaluatedSha} on attempt ${attempt}.`);
                return;
              } catch (error) {
                const message = String(error?.message || error);
                const retryable = message.includes("405") || message.includes("Base branch was modified");
                if (retryable && attempt < 24) {
                  core.notice(`Could not merge PR #${pull_number}; re-evaluating the gate in 15s (attempt ${attempt}/24): ${message}`);
                  await sleep(15_000);
                  continue;
                }
                core.warning(`Could not merge PR #${pull_number}: ${message}`);
                return;
              }
            }

      - name: Skip note
        if: steps.gate.outputs.should_merge != 'true'
        run: |
          echo "Dependabot PR does not meet auto-merge policy: ${{ steps.gate.outputs.reason }}"

  reconcile-open-prs:
    name: "Reconcile open Dependabot PRs"
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read

    steps:
      - name: Merge open Dependabot PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requiredChecks = [
              "Semantic review",
              "Scope-Abgleich (keine toten Projekte)",
              "Frontend PR Gate (website)",
              "Frontend PR Gate (admin_dashboard)",
              "Frontend PR Gate (dashboard_v2)",
              "Rust SQLx required",
            ];

            const verifyGate = async (pull_number) => {
              let pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              const evaluatedSha = pr.head.sha;
              const evaluatedBaseSha = pr.base.sha;

              if (
                pr.user?.login !== "dependabot[bot]" ||
                pr.base.ref !== "main" ||
                pr.draft ||
                pr.head.repo?.full_name !== `${owner}/${repo}`
              ) {
                return { ready: false, reason: "PR is no longer an eligible Dependabot main PR" };
              }

              const comparison = await github.request("GET /repos/{owner}/{repo}/compare/{basehead}", {
                owner,
                repo,
                basehead: `${evaluatedBaseSha}...${evaluatedSha}`,
              });
              if ((comparison.data.behind_by || 0) > 0) {
                return { ready: false, reason: `branch is behind main by ${comparison.data.behind_by}` };
              }
              if (pr.mergeable !== true || pr.mergeable_state === "dirty") {
                return { ready: false, reason: `mergeability is ${pr.mergeable_state || "unknown"}` };
              }

              const checkResponse = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: evaluatedSha,
                filter: "latest",
                per_page: 100,
              });
              const trustedChecks = (checkResponse.data.check_runs || []).filter(
                (check) => check.head_sha === evaluatedSha && check.app?.slug === "github-actions",
              );
              const byName = new Map(trustedChecks.map((check) => [check.name, check]));
              const missing = requiredChecks.filter((name) => !byName.has(name));
              const incomplete = requiredChecks.filter((name) => {
                const check = byName.get(name);
                return check && (check.status !== "completed" || check.conclusion !== "success");
              });
              if (missing.length || incomplete.length) {
                return {
                  ready: false,
                  reason: `required checks not green (missing=${missing.join(",") || "none"}; incomplete=${incomplete.join(",") || "none"})`,
                };
              }

              const accepted = new Set(["success", "neutral", "skipped"]);
              const ignoredOwnChecks = new Set([
                "Auto-merge trusted Dependabot updates",
                "Reconcile open Dependabot PRs",
              ]);
              const blockingChecks = (checkResponse.data.check_runs || []).filter(
                (check) =>
                  check.head_sha === evaluatedSha &&
                  !ignoredOwnChecks.has(check.name) &&
                  (check.status !== "completed" || !accepted.has(check.conclusion || "")),
              );
              if (blockingChecks.length) {
                return {
                  ready: false,
                  reason: `other checks not green: ${blockingChecks.map((check) => `${check.name}=${check.status}/${check.conclusion || "pending"}`).join(", ")}`,
                };
              }

              const statusResponse = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: evaluatedSha,
                per_page: 100,
              });
              const latestByContext = new Map();
              for (const status of statusResponse.data.statuses || []) {
                const previous = latestByContext.get(status.context);
                if (
                  !previous ||
                  new Date(status.created_at || 0).getTime() >
                    new Date(previous.created_at || 0).getTime()
                ) {
                  latestByContext.set(status.context, status);
                }
              }
              const blockingStatuses = [...latestByContext.values()].filter(
                (status) => status.state !== "success",
              );
              if (blockingStatuses.length) {
                return {
                  ready: false,
                  reason: `commit statuses not green: ${blockingStatuses.map((status) => `${status.context}=${status.state}`).join(", ")}`,
                };
              }

              pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              if (pr.head.sha !== evaluatedSha || pr.base.sha !== evaluatedBaseSha) {
                return { ready: false, reason: "head or base changed during gate evaluation" };
              }
              return { ready: true, evaluatedSha };
            };

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const dependabotPulls = pulls.filter(
              (pull) => pull.user?.login === "dependabot[bot]" && pull.draft === false,
            );

            for (const pull of dependabotPulls) {
              // Skip PRs that touch workflow files — GITHUB_TOKEN cannot merge those
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              const touchesWorkflows = files.some((f) => f.filename.startsWith(".github/workflows/"));
              if (touchesWorkflows) {
                core.notice(`PR #${pull.number} modifies workflow files — requires manual merge (GITHUB_TOKEN lacks workflow scope).`);
                continue;
              }

              const gate = await verifyGate(pull.number);
              if (!gate.ready) {
                core.notice(`PR #${pull.number} remains open: ${gate.reason}.`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pull.number,
                  merge_method: "squash",
                  sha: gate.evaluatedSha,
                });
                core.notice(`PR #${pull.number} merged at verified head ${gate.evaluatedSha}.`);
              } catch (error) {
                core.warning(`Could not merge PR #${pull.number}: ${String(error?.message || error)}`);
              }
            }
