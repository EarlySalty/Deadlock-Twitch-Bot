name: "Dependabot Auto Merge"

# Trusted metadata only. NEVER check out or execute pull-request code here.
on:
  # zizmor exception: trusted metadata only, no checkout/artifact consumption.
  # Immutable bot identity, same-repo head and enforced checks are mandatory.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: "Enable gated Dependabot auto-merge"
    if: >-
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch authenticated Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Require conservative policy and enforced PR checks
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        with:
          script: |
            core.setOutput("eligible", "false");

            const permittedUpdateTypes = [
              "version-update:semver-patch",
              "version-update:semver-minor",
            ];
            if (!permittedUpdateTypes.includes(process.env.UPDATE_TYPE || "")) {
              core.notice("Major, unknown and unclassified updates require manual review.");
              return;
            }

            if (
              !["npm", "cargo", "pip"].includes(process.env.ECOSYSTEM || "") ||
              process.env.MAINTAINER_CHANGES !== "false"
            ) {
              core.notice("Actions updates and maintainer changes require manual review.");
              return;
            }

            const pr = context.payload.pull_request;
            const defaultBranch = context.payload.repository.default_branch;
            if (pr.base.ref !== defaultBranch) {
              core.notice("Dependabot auto-merge is limited to the default branch.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const protectedPolicyPath = (filename) =>
              filename.startsWith(".github/") ||
              filename.startsWith("scripts/ci/") ||
              /^rust\/scripts\/(?:central_ci|central_fresh_schema|central_test_db|check)\.sh$/.test(filename);
            const protectedChanges = files
              .map((file) => file.filename)
              .filter(protectedPolicyPath);
            if (protectedChanges.length > 0) {
              core.notice(
                `CI/release-policy changes require manual bootstrap: ${protectedChanges.join(", ")}`,
              );
              return;
            }

            // Native auto-merge is only safe when GitHub itself enforces every
            // release check. Otherwise --auto may merge immediately.
            const requiredChecks = [
              "Semantic review",
              "Scope-Abgleich (keine toten Projekte)",
              "Frontend PR Gate (website)",
              "Frontend PR Gate (admin_dashboard)",
              "Frontend PR Gate (dashboard_v2)",
              "Rust SQLx required",
            ];
            const { data: rules } = await github.request(
              "GET /repos/{owner}/{repo}/rules/branches/{branch}",
              { ...context.repo, branch: defaultBranch },
            );
            const statusRules = rules.filter(
              (rule) =>
                rule.type === "required_status_checks" &&
                rule.parameters?.strict_required_status_checks_policy === true,
            );
            const enforcedChecks = new Set(
              statusRules.flatMap((rule) =>
                (rule.parameters?.required_status_checks || [])
                  .filter((check) => check.integration_id === 15368)
                  .map((check) => check.context),
              ),
            );
            const missing = requiredChecks.filter((check) => !enforcedChecks.has(check));
            if (missing.length > 0) {
              core.notice(
                `Dependabot auto-merge stays OFF until GitHub Actions enforces: ${missing.join(", ")}`,
              );
              return;
            }

            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (
              current.state !== "open" ||
              current.head.sha !== pr.head.sha ||
              current.base.ref !== defaultBranch
            ) {
              core.notice("PR state or head changed; the newer event must re-evaluate eligibility.");
              return;
            }

            core.setOutput("eligible", "true");

      - name: Enable native auto-merge after the exact head was evaluated
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
