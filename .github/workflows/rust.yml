name: "Rust"

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "ops/systemd/**"
      - ".github/workflows/rust.yml"
      - ".github/cargo-deny.toml"
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "ops/systemd/**"
      - ".github/workflows/rust.yml"
      - ".github/cargo-deny.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  clippy:
    name: "clippy (alerts + deny warnings)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-binstall

      - name: Install clippy-sarif and sarif-fmt
        run: cargo binstall -y --locked clippy-sarif sarif-fmt

      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --message-format=json \
            | clippy-sarif | tee clippy.sarif | sarif-fmt

      - name: Upload clippy SARIF
        if: always() && hashFiles('rust/clippy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: rust/clippy.sarif
          category: clippy

      - name: Fail on clippy warnings
        run: |
          count=$(jq '[.runs[].results[]] | length' clippy.sarif)
          echo "clippy findings: $count"
          test "$count" -eq 0

  test:
    name: "cargo test (workspace)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tbtest-throwaway
          POSTGRES_DB: twitch_test
        ports:
          - 40432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d twitch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TB_TEST_DATABASE_URL: postgres://postgres:tbtest-throwaway@127.0.0.1:40432/twitch_test
      TB_TEST_REQUIRE_DB: "1"
      TURNIER_TEST_DB_CONFIRM: throwaway-only
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Ensure PostgreSQL 16 binaries for embedded test servers
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/postgres ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-16
          fi
          /usr/lib/postgresql/16/bin/postgres --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Run workspace tests
        run: cargo test --workspace --locked --no-fail-fast

  audit:
    name: "cargo-audit (RustSec)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  deny:
    name: "cargo-deny (advisories bans sources)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --config ../.github/cargo-deny.toml check --hide-inclusion-graph advisories bans sources
