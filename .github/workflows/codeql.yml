name: "CodeQL Advanced (auto-detect)"

on:
  schedule:
    - cron: "44 10 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build: none
            node: true
          - language: actions
            build: none
            node: true
          # Achtung beim Lesen der Rust-Ergebnisse: der Extraktor liest 517 der
          # 563 Dateien mit Fehlern ein, weil er tracing::info und Verwandtes
          # nicht expandieren kann. Die Quote aufgeloester Aufrufziele liegt bei
          # 42 Prozent gegen einen Schwellwert von 50. Ein Lauf ohne Treffer
          # belegt deshalb nichts. Geprueft und wirkungslos: cargo fetch,
          # cargo check --workspace, CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR
          # auf das gebaute Verzeichnis (jeweils unveraendert 517 von 563).
          - language: rust
            build: none
            node: false

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: matrix.node == true
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:${{ matrix.language }}

      - name: Archive SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: "**/*.sarif"
          if-no-files-found: ignore
          retention-days: 30
