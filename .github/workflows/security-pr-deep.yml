name: PR deep scans and negative controls

# Untrusted PR code is analyzed, never given deployment or reporting privileges.
# The existing scheduled CodeQL/Scorecard/deep workflows remain independent.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  scanner-controls:
    name: Real scanner positive and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned scanner binaries
        run: |
          mkdir "$RUNNER_TEMP/control-tools"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP/control-tools" gitleaks
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  %s\n' "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/trivy.tar.gz" --directory "$RUNNER_TEMP/control-tools" trivy
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" --directory "$RUNNER_TEMP/control-tools" actionlint
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/zizmor.tar.gz"
          printf 'ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed  %s\n' "$RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/zizmor.tar.gz" --directory "$RUNNER_TEMP/control-tools" zizmor
          pipx install semgrep==1.176.1
          rustup toolchain install 1.98.0 --profile minimal
      - name: Generate isolated, never-executed fixtures
        run: |
          rustc +1.98.0 --edition=2021 -D warnings .github/ci/negative_controls.rs -o "$RUNNER_TEMP/negative-controls"
          "$RUNNER_TEMP/negative-controls" fixtures "$RUNNER_TEMP/scanner-fixtures"
          mkdir "$RUNNER_TEMP/control-reports"
      - name: Prove narrow Gitleaks exceptions and provider detection
        # Match the real scanner's repository-relative File field. A scratch
        # prefix would incorrectly prevent the intentionally anchored rules.
        run: |
          cd "$RUNNER_TEMP/scanner-fixtures/secrets-allowed"
          "$RUNNER_TEMP/control-tools/gitleaks" dir --no-banner --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --report-format json --report-path "$RUNNER_TEMP/control-reports/gitleaks-positive.json" .
          cd "$RUNNER_TEMP/scanner-fixtures/secrets-negative"
          "$RUNNER_TEMP/negative-controls" expect 1 "$RUNNER_TEMP/control-reports/gitleaks-negative.json" \
            generic-api-key ad_manager.rs obs/ws.rs partner-clean/Security.tsx outside-allowlist.rs -- \
            "$RUNNER_TEMP/control-tools/gitleaks" dir --no-banner --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --report-format json --report-path "$RUNNER_TEMP/control-reports/gitleaks-negative.json" .
          cd "$RUNNER_TEMP/scanner-fixtures/provider-negative"
          "$RUNNER_TEMP/negative-controls" expect 1 "$RUNNER_TEMP/control-reports/provider-negative.json" github-pat -- \
            "$RUNNER_TEMP/control-tools/gitleaks" dir --no-banner --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --report-format json --report-path "$RUNNER_TEMP/control-reports/provider-negative.json" .
      - name: Prove Rust SAST detects disabled certificate validation
        if: ${{ !cancelled() }}
        run: |
          semgrep scan --config p/rust --severity WARNING --severity ERROR --error --strict \
            --metrics=off --disable-version-check --jobs 2 --timeout 60 \
            --json --output "$RUNNER_TEMP/control-reports/semgrep-positive.json" \
            "$RUNNER_TEMP/scanner-fixtures/sast-positive"
          "$RUNNER_TEMP/negative-controls" expect 1 "$RUNNER_TEMP/control-reports/semgrep-negative.json" reqwest-accept-invalid -- \
            semgrep scan --config p/rust --severity WARNING --severity ERROR --error --strict \
            --metrics=off --disable-version-check --jobs 2 --timeout 60 \
            --json --output "$RUNNER_TEMP/control-reports/semgrep-negative.json" \
            "$RUNNER_TEMP/scanner-fixtures/sast-negative"
      - name: Prove Trivy detects vulnerable dependency metadata without installing it
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/control-tools/trivy" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore.yaml --format json --output "$RUNNER_TEMP/control-reports/trivy-positive.json" \
            "$RUNNER_TEMP/scanner-fixtures/dependency-positive"
          "$RUNNER_TEMP/negative-controls" expect 1 "$RUNNER_TEMP/control-reports/trivy-negative.json" CVE-2021-23337 -- \
            "$RUNNER_TEMP/control-tools/trivy" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore.yaml --format json --output "$RUNNER_TEMP/control-reports/trivy-negative.json" \
            "$RUNNER_TEMP/scanner-fixtures/dependency-negative"
      - name: Prove Actions syntax and HIGH security findings block
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/control-tools/actionlint" "$RUNNER_TEMP/scanner-fixtures/actions-positive/valid.yml"
          "$RUNNER_TEMP/negative-controls" expect-stdout 1 "$RUNNER_TEMP/control-reports/actionlint-negative.txt" invalid_workflow_key -- \
            "$RUNNER_TEMP/control-tools/actionlint" "$RUNNER_TEMP/scanner-fixtures/actions-negative/syntax.yml"
          "$RUNNER_TEMP/control-tools/zizmor" --offline --strict-collection --min-severity high \
            "$RUNNER_TEMP/scanner-fixtures/actions-positive/valid.yml"
          "$RUNNER_TEMP/negative-controls" expect-stdout 14 "$RUNNER_TEMP/control-reports/zizmor-negative.json" template-injection -- \
            "$RUNNER_TEMP/control-tools/zizmor" --offline --strict-collection --min-severity high --format json \
            "$RUNNER_TEMP/scanner-fixtures/actions-negative/security.yml"
      - name: Preserve counterexample evidence
        if: always()
        continue-on-error: true # Reporting only; every control above is blocking.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-counterexample-reports
          path: ${{ runner.temp }}/control-reports/
          if-no-files-found: warn
          retention-days: 14

  osv:
    name: OSV lockfile scan and controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned OSV 2.6.0
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          printf 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  %s\n' "$RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          rustup toolchain install 1.98.0 --profile minimal
      - name: Prove OSV controls without installing fixture dependencies
        run: |
          rustc +1.98.0 --edition=2021 -D warnings .github/ci/negative_controls.rs -o "$RUNNER_TEMP/negative-controls"
          "$RUNNER_TEMP/negative-controls" fixtures "$RUNNER_TEMP/osv-fixtures"
          mkdir "$RUNNER_TEMP/osv-reports"
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --no-ignore --no-resolve --format json \
            --output-file "$RUNNER_TEMP/osv-reports/positive.json" "$RUNNER_TEMP/osv-fixtures/dependency-positive"
          "$RUNNER_TEMP/negative-controls" expect 1 "$RUNNER_TEMP/osv-reports/negative.json" CVE-2021-23337 -- \
            "$RUNNER_TEMP/osv-scanner" scan source --recursive --no-ignore --no-resolve --format json \
            --output-file "$RUNNER_TEMP/osv-reports/negative.json" "$RUNNER_TEMP/osv-fixtures/dependency-negative"
      - name: Scan tracked dependency manifests and locks
        if: ${{ !cancelled() }}
        # A fresh checkout contains no generated application artifacts. The
        # repository's broad *.json ignore must NOT hide committed npm locks.
        # Source scan only: no osv fix, call-analysis, package scripts or images.
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --no-ignore --no-resolve --format json \
            --output-file "$RUNNER_TEMP/osv-reports/repository.json" .
      - name: Preserve OSV evidence
        if: always()
        continue-on-error: true # Reporting only, not a vulnerability exception.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-pr-reports
          path: ${{ runner.temp }}/osv-reports/
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: Read-only CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Native Rust SAST remains mandatory. Rust CodeQL's known extraction
        # failure stays visible in the scheduled workflow, not called coverage.
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize read-only CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze without Code Scanning or database upload
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          upload: never
          upload-database: false
          output: codeql-pr-results
          category: /pr-readonly/language:${{ matrix.language }}
      - name: Require complete evidence and enforce finding policy
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustc +1.98.0 --edition=2021 -D warnings --test .github/ci/report_gate.rs -o "$RUNNER_TEMP/report-gate-tests"
          "$RUNNER_TEMP/report-gate-tests"
          rustc +1.98.0 --edition=2021 -D warnings .github/ci/report_gate.rs -o "$RUNNER_TEMP/report-gate"
          found=false
          for report in codeql-pr-results/*.sarif; do
            test -f "$report"
            found=true
            "$RUNNER_TEMP/report-gate" "$report"
          done
          test "$found" = true
      - name: Preserve CodeQL evidence
        if: always()
        continue-on-error: true # Reporting only; analysis and policy are required.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-pr-${{ matrix.language }}
          path: codeql-pr-results/*.sarif
          if-no-files-found: warn
          retention-days: 14
