[workspace]
resolver = "2"
members = [
    "crates/tb-error",
    "crates/tb-crypto",
    "crates/tb-domain",
    "crates/tb-config",
    "crates/tb-observability",
    "crates/tb-db",
    "crates/tb-transport-twitch",
    "crates/tb-transport-discord",
    "crates/tb-monitoring",
    "crates/tb-platform-core",
    "crates/tb-raid",
    "crates/tb-http-core",
    "crates/tb-analytics",
    "crates/tb-chat",
    "crates/tb-dashboard-api",
    "crates/tb-internal-api",
    "crates/tb-social-media",
    "crates/tb-highlight",
    "crates/tb-engagement",
    "crates/tb-knowledge",
    "crates/tb-tips",
    "crates/tb-llm",
    "crates/tb-vod-archive",
    "crates/tb-stream-audit",
    "crates/tb-scout",
    "bin/tb-stream-audit",
    "bin/tb-dashboard",
    "bin/tb-bot",
]

[workspace.package]
edition = "2021"

# Zentrale Versionspflege — jede Crate referenziert via `{ workspace = true }`.
[workspace.dependencies]
thiserror = "1"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
base64 = "0.22"
hex = "0.4"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
# default-features=false: wir nutzen nur die HTML-Renderer-Funktion (html::push_html);
# das Default-Feature "getopts" gehört zum bundled CLI-Tool des Crates und wird
# von uns als Library-Dependency nie aufgerufen — zieht sonst getopts+deps unnötig mit.
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
rand = "0.8"
zeroize = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
blake2 = "0.11"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-br", "compression-gzip", "set-header"] }
async-trait = "0.1"
# Nur fuer `StreamExt::split` auf dem axum-WebSocket (OBS-Dock-Gateway); liegt
# ueber sqlx ohnehin schon im Lock.
futures-util = "0.3"
arc-swap = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
printpdf = { version = "0.12.7", default-features = false }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
tb-error = { path = "crates/tb-error" }
tb-crypto = { path = "crates/tb-crypto" }
tb-domain = { path = "crates/tb-domain" }
tb-config = { path = "crates/tb-config" }
tb-observability = { path = "crates/tb-observability" }
tb-db = { path = "crates/tb-db" }
tb-transport-twitch = { path = "crates/tb-transport-twitch" }
tb-transport-discord = { path = "crates/tb-transport-discord" }
tb-monitoring = { path = "crates/tb-monitoring" }
tb-platform-core = { path = "crates/tb-platform-core" }
tb-raid = { path = "crates/tb-raid" }
tb-http-core     = { path = "crates/tb-http-core" }
tb-analytics     = { path = "crates/tb-analytics" }
tb-chat          = { path = "crates/tb-chat" }
tb-dashboard-api = { path = "crates/tb-dashboard-api" }
tb-internal-api  = { path = "crates/tb-internal-api" }
tb-social-media  = { path = "crates/tb-social-media" }
tb-highlight     = { path = "crates/tb-highlight" }
tb-engagement    = { path = "crates/tb-engagement" }
tb-knowledge     = { path = "crates/tb-knowledge" }
tb-tips          = { path = "crates/tb-tips" }
tb-llm           = { path = "crates/tb-llm" }
tb-vod-archive   = { path = "crates/tb-vod-archive" }
tb-stream-audit  = { path = "crates/tb-stream-audit" }
tb-scout         = { path = "crates/tb-scout" }
url = "2"
regex = "1"
unicode-normalization = "0.1"
dashmap = "6"
strsim = "0.11"

# Produktions-Optimierungsprofil für den Dauerlauf-Server.
# lto = "thin": Thin-LTO statt Fat-LTO — nahezu gleiche Größen-/Laufzeitwirkung,
#   aber deutlich kürzere Link-Zeit (kein monolithischer Codegen-Pass über alle
#   Crates). Fat-LTO lohnt sich erst bei sehr kleinen, latenzgetriebenen
#   Single-Binary-Tools ohne Build-CI-Druck — hier nicht der Fall.
# codegen-units = 1: zwingt LLVM zu einem einzigen Codegen-Durchlauf je Crate,
#   was Inlining und Optimierung über Modulgrenzen hinweg verbessert.
# panic = "abort" wird NICHT gesetzt: ein Panic in einem Tokio-Task soll den
#   Task abreißen, nicht den gesamten Prozess — das setzt voraus, dass der
#   Stack-Unwinder läuft. Außerdem brechen should_panic-Tests mit abort-Modus.
[profile.release]
lto          = "thin"
codegen-units = 1
