[workspace]
resolver = "2"
members = [
    "crates/tb-error",
    "crates/tb-crypto",
    "crates/tb-domain",
    "crates/tb-config",
    "crates/tb-observability",
    "crates/tb-db",
    "crates/tb-transport-twitch",
    "crates/tb-transport-discord",
    "crates/tb-http-core",
    "crates/tb-analytics",
    "crates/tb-dashboard-api",
    "bin/tb-dashboard",
]

[workspace.package]
edition = "2021"

# Zentrale Versionspflege — jede Crate referenziert via `{ workspace = true }`.
[workspace.dependencies]
thiserror = "1"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
wiremock = "0.6"
tb-error = { path = "crates/tb-error" }
tb-crypto = { path = "crates/tb-crypto" }
tb-domain = { path = "crates/tb-domain" }
tb-config = { path = "crates/tb-config" }
tb-observability = { path = "crates/tb-observability" }
tb-db = { path = "crates/tb-db" }
tb-transport-twitch = { path = "crates/tb-transport-twitch" }
tb-transport-discord = { path = "crates/tb-transport-discord" }
tb-http-core     = { path = "crates/tb-http-core" }
tb-analytics     = { path = "crates/tb-analytics" }
tb-dashboard-api = { path = "crates/tb-dashboard-api" }
