[workspace]
resolver = "2"
members = [
    "crates/tb-error",
    "crates/tb-crypto",
]

[workspace.package]
edition = "2021"

# Zentrale Versionspflege — jede Crate referenziert via `{ workspace = true }`.
[workspace.dependencies]
thiserror = "1"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = "1"
serde_json = "1"
tb-error = { path = "crates/tb-error" }
tb-crypto = { path = "crates/tb-crypto" }
