<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deadlock Overlay</title>
  <style>
    :root {
      --bg-alpha: 0.85;
      --radius: 14px;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* --- Themes via data-theme + CSS Custom Properties --- */
    #overlay-card[data-theme="dark"] {
      --bg: rgba(13, 15, 20, var(--bg-alpha));
      --fg: #f4f7fb;
      --muted: #9aa6b6;
      --accent: #d6b56c;
      --accent-2: #d6b56c;
      --win: #34d399;
      --loss: #fb7185;
      --border: rgba(255, 255, 255, 0.10);
      --accent-line: linear-gradient(90deg, var(--accent), transparent);
    }

    #overlay-card[data-theme="light"] {
      --bg: rgba(248, 250, 253, var(--bg-alpha));
      --fg: #0f172a;
      --muted: #475569;
      --accent: #0891b2;
      --accent-2: #0891b2;
      --win: #059669;
      --loss: #e11d48;
      --border: rgba(15, 23, 42, 0.12);
      --accent-line: linear-gradient(90deg, var(--accent), transparent);
    }

    #overlay-card[data-theme="accent"] {
      --bg: rgba(16, 12, 26, var(--bg-alpha));
      --fg: #f6f4ff;
      --muted: #b3a7cf;
      --accent: #06B6D4;
      --accent-2: #A855F7;
      --win: #34d399;
      --loss: #fb7185;
      --border: rgba(255, 255, 255, 0.12);
      --accent-line: linear-gradient(135deg, #06B6D4, #A855F7);
    }

    #overlay-card {
      position: fixed;
      box-sizing: border-box;
      display: none;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      --radius: 18px;
      --muted: color-mix(in srgb, var(--fg) 65%, transparent);
    }

    #overlay-card.overlay-pos-bl {
      left: 18px;
      bottom: 18px;
    }
    #overlay-card.overlay-pos-br {
      right: 18px;
      bottom: 18px;
    }
    #overlay-card.overlay-pos-tl {
      left: 18px;
      top: 18px;
    }
    #overlay-card.overlay-pos-tr {
      right: 18px;
      top: 18px;
    }

    #overlay-card.visible {
      display: block;
      animation: overlay-enter 180ms ease-out;
    }

    /* --- Box-Layout: Glassmorphism-Karte --- */
    #overlay-card.layout-box {
      width: 400px;
      padding: 22px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: inset 0 0 0 1px #ffffff0a, 0 12px 32px #0008;
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      position: fixed;
      overflow: hidden;
      max-width: calc(100vw - 36px);
      border-color: color-mix(in srgb, var(--accent) 65%, transparent);
    }

    #overlay-card.layout-box::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: var(--accent);
      opacity: 0.9;
    }

    /* --- Freie OBS-Leinwand: Position und Größe kommen aus der URL --- */
    #overlay-card.layout-canvas {
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      padding: 0;
      overflow: hidden;
      position: fixed;
      background: transparent;
      border: 0;
      box-shadow: none;
      transform: none !important;
    }

    .ov-canvas-source {
      position: absolute;
      box-sizing: border-box;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 16px;
      border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--border));
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: inset 0 0 0 1px #ffffff0a, 0 12px 32px #0008;
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
    }

    .layout-canvas .ov-canvas-source[data-module="rank"] {
      border-color: color-mix(in srgb, var(--accent) 85%, var(--border));
    }

    .layout-canvas .ov-canvas-source[data-module="rank"] .ov-value {
      font-size: 30px;
    }

    .layout-canvas .ov-canvas-source .ov-cell,
    .layout-canvas .ov-canvas-source .ov-cell:first-child {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .layout-canvas .ov-canvas-source .rank-badge {
      width: 88px;
      height: 88px;
    }

    .layout-canvas .ov-canvas-source .ov-recent {
      margin: 0;
    }

    .layout-canvas .ov-canvas-source .ov-recent-row {
      gap: 10px;
    }

    .layout-canvas .ov-canvas-source .ov-tile {
      width: 42px;
      height: 46px;
      border-radius: 10px;
    }

    .layout-canvas .ov-canvas-source .ov-brand {
      height: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .layout-canvas .ov-canvas-source .ov-brand-logo {
      width: 48px;
      height: 48px;
    }

    .layout-canvas .ov-canvas-source .ov-brand-wordmark {
      width: 185px;
      height: 48px;
    }

    .ov-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ov-name {
      min-width: 0;
      font-size: 23px;
      font-weight: 850;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.03em;
    }

    .ov-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--win);
    }

    .ov-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--win);
      box-shadow: 0 0 0 0 var(--win);
      animation: ov-pulse 1.6s ease-out infinite;
    }

    .ov-head-rule {
      height: 1px;
      margin: 15px 0;
      border-radius: 2px;
      background: var(--border);
      opacity: 0.75;
    }

    /* --- Stat-Raster (Box) --- */
    .ov-grid {
      display: grid;
      flex-wrap: wrap;
      align-items: stretch;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .ov-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 2px 12px;
      flex: 1 1 auto;
      min-width: 0;
      border-left: 1px solid var(--border);
    }

    .ov-cell:first-child {
      padding-left: 0;
      border-left: 0;
    }

    .ov-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ov-value {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 22px;
      font-weight: 700;
      color: var(--fg);
      white-space: normal;
      flex-wrap: wrap;
    }

    .ov-value .ov-win {
      color: var(--win);
    }
    .ov-value .ov-loss {
      color: var(--loss);
    }
    .ov-delta-up {
      color: var(--win);
      font-size: 13px;
    }
    .ov-delta-down {
      color: var(--loss);
      font-size: 13px;
    }

    .ov-hero-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .ov-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .ov-sub-kda {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .rank-badge {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
    }

    .ov-main-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      border-radius: 7px;
      object-fit: cover;
      background: rgba(127, 127, 127, 0.18);
    }

    /* --- Recent-Matches-Strip --- */
    .ov-recent {
      margin-top: 17px;
    }

    .ov-recent-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .ov-recent-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Hero-Kachel: abgerundetes Quadrat mit Portrait, Sieg/Niederlage als
       dezenter farbiger Unterstrich (keine Vollfarb-Fläche). */
    .ov-tile {
      width: 29px;
      height: 31px;
      flex: 0 0 auto;
      border-radius: 6px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      object-fit: cover;
      background: rgba(127, 127, 127, 0.16);
      border: 1px solid var(--border);
      border-bottom-width: 3px;
    }

    .ov-tile.win {
      border-bottom-color: var(--win);
    }
    .ov-tile.loss {
      border-bottom-color: var(--loss);
    }

    /* Fallback ohne Icon: dezente Kachel mit S/N-Buchstabe in --win/--loss. */
    .ov-tile-fallback {
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
    }

    .ov-tile-fallback.win {
      color: var(--win);
    }
    .ov-tile-fallback.loss {
      color: var(--loss);
    }

    /* --- Branding --- */
    .ov-brand {
      margin-top: 17px;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--fg);
      opacity: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    /* --- Bar-Layout: schlanke Pille --- */
    #overlay-card.layout-bar {
      max-width: calc(100vw - 36px);
      padding: 16px 20px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      width: 920px;
      border-color: color-mix(in srgb, var(--accent) 65%, transparent);
    }

    #overlay-card.layout-bar .ov-bar {
      display: flex;
      align-items: center;
      gap: 12px 20px;
      white-space: normal;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .ov-seg {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .ov-seg + .ov-seg::before {
      content: "·";
      margin: 0 10px;
      color: var(--muted);
      opacity: 0.7;
      display: none;
    }

    .ov-seg .ov-seg-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ov-seg .ov-seg-value {
      font-weight: 700;
      color: var(--fg);
    }

    .ov-seg .rank-badge {
      width: 26px;
      height: 26px;
    }
    .ov-seg .ov-recent-row {
      flex-wrap: wrap;
      gap: 4px;
    }
    .ov-seg .ov-recent-row .ov-tile {
      width: 20px;
      height: 20px;
      border-radius: 6px;
    }
    .ov-seg .ov-recent-row .ov-tile-fallback {
      font-size: 10px;
    }

    @keyframes overlay-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes ov-pulse {
      0% { box-shadow: 0 0 0 0 var(--win); opacity: 1; }
      70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); opacity: 0.85; }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); opacity: 1; }
    }

    /* OBS: stabile Raster, sichtbare Hierarchie und frei wählbare Farben. */







    .ov-cell, .ov-cell:first-child {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #00000012;
      gap: 7px;
    }
    .ov-cell[data-module="rank"] {
      grid-column: 1 / -1;
      background: color-mix(in srgb, var(--accent) 9%, transparent);
    }
    .ov-cell[data-module="rank"] .ov-value {
      font-size: 25px;
    }



    .ov-label, .ov-recent-label {
      font-size: 10px;
      letter-spacing: .12em;
    }




    .ov-brand-logo {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      object-fit: contain;
    }
    .ov-brand-wordmark {
      display: block;
      width: 140px;
      height: 36px;
      max-width: calc(100% - 46px);
      flex: 0 1 auto;
      object-fit: contain;
      object-position: left center;
    }




    .ov-seg .ov-value {
      font-size: 18px;
    }

    .layout-bar .ov-brand {
      padding-top: 10px;
      margin-top: 12px;
    }
    .layout-bar .ov-brand-logo {
      width: 28px;
      height: 28px;
    }
    .layout-bar .ov-brand-wordmark {
      width: 120px;
      height: 30px;
    }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
  </style>
</head>
<body>
  <!-- Rang-/Hero-Bilder sind Deadlock-Spiel-Assets (© Valve), geladen über die öffentliche deadlock-api Assets-CDN; nur Asset-URLs, kein fremder Streamkit-Code. -->
  <div id="overlay-card" aria-live="polite"></div>
  <script>
    const card = document.getElementById('overlay-card');
    const params = new URLSearchParams(window.location.search);
    const streamer = (params.get('streamer') || '').trim();

    const oneOf = (key, allowed, fallback) => {
      const value = (params.get(key) || '').trim().toLowerCase();
      return allowed.includes(value) ? value : fallback;
    };
    const flag = (key, fallback) => {
      const value = params.get(key);
      if (value === null) return fallback;
      return value !== '0';
    };
    const clampInt = (key, min, max, fallback) => {
      const value = parseInt(params.get(key) || '', 10);
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, value));
    };

    const theme = oneOf('theme', ['dark', 'light', 'accent'], 'dark');
    const layout = oneOf('layout', ['box', 'bar', 'canvas'], 'box');
    const mode = oneOf('mode', ['all', 'standard', 'brawl'], 'all');
    const position = oneOf('pos', ['bl', 'br', 'tl', 'tr'], 'tl');
    const opacity = clampInt('opacity', 0, 100, 85);
    const recentN = clampInt('recent_n', 1, 15, 10);
    const canvasWidth = clampInt('canvas_w', 320, 3840, 1920);
    const canvasHeight = clampInt('canvas_h', 180, 2160, 1080);
    const defaultCanvasScene = {
      header: { x: 48, y: 48, width: 420, height: 84 },
      live: { x: 492, y: 48, width: 220, height: 84 },
      rank: { x: 48, y: 156, width: 664, height: 170 },
      winrate: { x: 48, y: 350, width: 320, height: 112 },
      today: { x: 392, y: 350, width: 320, height: 112 },
      streak: { x: 48, y: 486, width: 320, height: 112 },
      kd: { x: 392, y: 486, width: 320, height: 112 },
      lastmatch: { x: 48, y: 622, width: 320, height: 112 },
      mostplayed: { x: 392, y: 622, width: 320, height: 112 },
      recent: { x: 48, y: 758, width: 664, height: 112 },
      branding: { x: 48, y: 894, width: 664, height: 80 },
    };
    const parseCanvasScene = (raw) => {
      if (!raw || raw.length > 12000) return {};
      try {
        const candidate = JSON.parse(raw);
        if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) return {};
        return candidate;
      } catch {
        return {};
      }
    };
    const canvasScene = parseCanvasScene(params.get('scene'));
    const canvasRect = (key) => {
      const fallback = defaultCanvasScene[key] || { x: 0, y: 0, width: 320, height: 100 };
      const candidate = canvasScene[key];
      const numberOr = (value, fallbackValue) => typeof value === 'number' && Number.isFinite(value) ? value : fallbackValue;
      const width = Math.min(canvasWidth, Math.max(24, numberOr(candidate && candidate.width, fallback.width)));
      const height = Math.min(canvasHeight, Math.max(24, numberOr(candidate && candidate.height, fallback.height)));
      const x = Math.min(Math.max(0, numberOr(candidate && candidate.x, fallback.x)), Math.max(0, canvasWidth - width));
      const y = Math.min(Math.max(0, numberOr(candidate && candidate.y, fallback.y)), Math.max(0, canvasHeight - height));
      return { x, y, width, height };
    };

    const flags = {
      header: flag('header', true),
      rank: flag('rank', true),
      winrate: flag('winrate', true),
      today: flag('today', true),
      streak: flag('streak', true),
      kd: flag('kd', true),
      lastmatch: flag('lastmatch', false),
      mostplayed: flag('mostplayed', false),
      recent: flag('recent', true),
      live: flag('live', true),
      branding: flag('branding', true),
    };

    card.dataset.theme = theme;
    card.classList.add(`layout-${layout}`);
    card.classList.add(`overlay-pos-${position}`);
    card.style.setProperty('--bg-alpha', String(opacity / 100));

    const hexColor = (key) => { const value = params.get(key) || ''; return /^#[0-9a-f]{6}$/i.test(value) ? value : null; };
    const accent = hexColor('accent');
    const foreground = hexColor('text');
    const background = hexColor('background');
    if (accent) { card.style.setProperty('--accent', accent); card.style.setProperty('--accent-line', accent); }
    if (foreground) { card.style.setProperty('--fg', foreground); card.style.setProperty('--muted', foreground); }
    if (background) { const rgb = [1, 3, 5].map(i => parseInt(background.slice(i, i + 2), 16)); card.style.setProperty('--bg', 'rgba(' + rgb.join(',') + ',' + opacity / 100 + ')'); }
    card.style.setProperty('--radius', clampInt('radius', 0, 32, 18) + 'px');
    function fitViewport() {
      if (layout === 'canvas') {
        card.style.transform = 'none';
        return;
      }
      const scale = Math.min(1, Math.max(1, window.innerWidth - 36) / Math.max(1, card.offsetWidth), Math.max(1, window.innerHeight - 36) / Math.max(1, card.offsetHeight));
      card.style.transformOrigin = (position.endsWith('r') ? 'right' : 'left') + ' ' + (position.startsWith('b') ? 'bottom' : 'top');
      card.style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', fitViewport);
    new ResizeObserver(fitViewport).observe(card);
    let latestData = null;

    const isNumber = (value) => typeof value === 'number' && Number.isFinite(value);
    const nf1 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const nf2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function rankBadgeUrl(badgeLevel) {
      if (!Number.isInteger(badgeLevel)) return null;
      const tier = Math.floor(badgeLevel / 10);
      const sub = badgeLevel % 10;
      if (tier < 1 || tier > 11) return null;

      const base = `https://api.deadlock-api.com/v1/assets/ranks/${tier}`;
      if (sub >= 1 && sub <= 6) return `${base}/${sub}/image`;
      return null;
    }

    function cleanIcon(value) {
      return typeof value === 'string' && value.trim() ? value.trim() : null;
    }

    function hide() {
      latestData = null;
      card.classList.remove('visible');
      card.replaceChildren();
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function fallbackTile(result) {
      return el('span', `ov-tile ov-tile-fallback ${result}`, result === 'win' ? 'S' : 'N');
    }

    function recentRow(recent) {
      const row = el('div', 'ov-recent-row');
      const items = Array.isArray(recent) ? recent.slice(0, recentN) : [];
      for (const match of items) {
        const result = match && match.result === 'win' ? 'win' : 'loss';
        const icon = cleanIcon(match && match.hero_icon);
        if (icon) {
          const image = el('img', `ov-tile ${result}`);
          image.src = icon;
          image.alt = (match.hero || 'Held') + ' – ' + (result === 'win' ? 'Sieg' : 'Niederlage');
          image.title = image.alt;
          image.decoding = 'async';
          image.loading = 'lazy';
          image.onerror = () => image.replaceWith(fallbackTile(result));
          row.appendChild(image);
        } else {
          row.appendChild(fallbackTile(result));
        }
      }
      return row.childElementCount ? row : null;
    }

    function rankValueNode(data) {
      const value = el('div', 'ov-value');
      const badge = cleanIcon(data.rank_badge_url) || rankBadgeUrl(data.badge_level);
      if (badge) {
        const image = el('img', 'rank-badge');
        image.src = badge;
        image.alt = '';
        image.decoding = 'async';
        image.loading = 'lazy';
        image.onerror = () => image.remove();
        value.appendChild(image);
      }
      value.appendChild(el('span', 'ov-hero-name', data.rank_name + (Number.isInteger(data.rank_subrank) && data.rank_subrank > 0 && !/\d$/.test(data.rank_name) ? ' ' + data.rank_subrank : '')));
      if (isNumber(data.delta) && data.delta > 0) value.appendChild(el('span', 'ov-delta-up', '▲'));
      if (isNumber(data.delta) && data.delta < 0) value.appendChild(el('span', 'ov-delta-down', '▼'));
      return value;
    }

    // Liefert die aktiven Module als kuratierte Liste {label, build()}.
    function activeModules(data) {
      const mods = [];

      if (flags.rank && data.rank_name) {
        mods.push({ key: 'rank', label: 'RANG', value: () => rankValueNode(data) });
      }

      if (flags.winrate && isNumber(data.winrate) && isNumber(data.wins) && isNumber(data.losses)) {
        mods.push({
          key: 'winrate',
          label: 'WINRATE',
          value: () => {
            const value = el('div', 'ov-value');
            value.appendChild(el('span', null, `${nf1.format(data.winrate)} %`));
            value.appendChild(el('span', 'ov-sub', `${data.wins}–${data.losses}`));
            return value;
          },
        });
      }

      if (flags.today && isNumber(data.today_wins) && isNumber(data.today_losses)) {
        mods.push({
          key: 'today',
          label: 'HEUTE',
          value: () => {
            const value = el('div', 'ov-value');
            value.appendChild(el('span', 'ov-win', String(data.today_wins)));
            value.appendChild(el('span', null, '–'));
            value.appendChild(el('span', 'ov-loss', String(data.today_losses)));
            return value;
          },
        });
      }

      if (flags.streak && isNumber(data.streak_len) && data.streak_len >= 1 &&
          (data.streak_kind === 'win' || data.streak_kind === 'loss')) {
        mods.push({
          key: 'streak',
          label: 'SERIE',
          value: () => {
            const value = el('div', 'ov-value');
            const cls = data.streak_kind === 'win' ? 'ov-win' : 'ov-loss';
            value.appendChild(el('span', cls, `${data.streak_len} ${data.streak_kind === 'win' ? (data.streak_len === 1 ? 'Sieg' : 'Siege') : (data.streak_len === 1 ? 'Niederlage' : 'Niederlagen')}`));
            return value;
          },
        });
      }

      if (flags.kd && isNumber(data.kd)) {
        mods.push({
          key: 'kd',
          label: 'K/D',
          value: () => el('div', 'ov-value', nf2.format(data.kd)),
        });
      }

      if (flags.lastmatch && (data.last_result === 'win' || data.last_result === 'loss')) {
        mods.push({
          key: 'lastmatch',
          label: 'LETZTES SPIEL',
          value: () => {
            const value = el('div', 'ov-value');
            const cls = data.last_result === 'win' ? 'ov-win' : 'ov-loss';
            value.appendChild(el('span', cls, data.last_result === 'win' ? 'Sieg' : 'Niederlage'));
            if (isNumber(data.last_kills) && isNumber(data.last_deaths) && isNumber(data.last_assists)) {
              value.appendChild(el('span', 'ov-sub-kda', `${data.last_kills}/${data.last_deaths}/${data.last_assists}`));
            }
            return value;
          },
        });
      }

      if (flags.mostplayed && data.most_played_hero) {
        mods.push({
          key: 'mostplayed',
          label: 'LIEBLINGSHELD',
          value: () => {
            const value = el('div', 'ov-value');
            const icon = cleanIcon(data.most_played_icon);
            if (icon) {
              const image = el('img', 'ov-main-icon');
              image.src = icon;
              image.alt = '';
              image.decoding = 'async';
              image.loading = 'lazy';
              image.onerror = () => image.remove();
              value.appendChild(image);
            }
            value.appendChild(el('span', 'ov-hero-name', data.most_played_hero));
            return value;
          },
        });
      }

      return mods;
    }

    function brandNode() {
      const brand = el('div', 'ov-brand');
      // Dieselben Marken-Assets wie auf der Hauptseite verwenden.
      const logo = el('img', 'ov-brand-logo');
      logo.src = '/brand/logo/logo-192.png';
      logo.alt = '';
      logo.decoding = 'async';
      const wordmark = el('img', 'ov-brand-wordmark');
      wordmark.src = '/brand/logo/wordmark.svg';
      wordmark.alt = 'Deutsche Deadlock Community';
      wordmark.decoding = 'async';
      brand.append(logo, wordmark); return brand;
    }

    function buildBox(data) {
      const frag = document.createDocumentFragment();

      if (flags.header && streamer) {
        const head = el('div', 'ov-head');
        head.appendChild(el('div', 'ov-name', streamer));
        if (flags.live && data.live === true) {
          const live = el('div', 'ov-live');
          live.appendChild(el('span', 'ov-live-dot'));
          const details = [];
          if (data.hero) details.push(data.hero);
          if (isNumber(data.minutes)) details.push(`${data.minutes}′`);
          live.appendChild(el('span', null, details.length ? `LIVE · ${details.join(' · ')}` : 'LIVE'));
          head.appendChild(live);
        }
        frag.appendChild(head);
        frag.appendChild(el('div', 'ov-head-rule'));
      } else if (flags.live && data.live === true) {
        const live = el('div', 'ov-live');
        live.style.marginBottom = '10px';
        live.appendChild(el('span', 'ov-live-dot'));
        const details = [];
        if (data.hero) details.push(data.hero);
        if (isNumber(data.minutes)) details.push(`${data.minutes}′`);
        live.appendChild(el('span', null, details.length ? `LIVE · ${details.join(' · ')}` : 'LIVE'));
        frag.appendChild(live);
      }

      const mods = activeModules(data);
      if (mods.length) {
        const grid = el('div', 'ov-grid');
        for (const mod of mods) {
          const cell = el('div', 'ov-cell');
          cell.dataset.module = mod.key;
          cell.appendChild(el('div', 'ov-label', mod.label));
          cell.appendChild(mod.value());
          grid.appendChild(cell);
        }
        frag.appendChild(grid);
      }

      if (flags.recent) {
        const row = recentRow(data.recent);
        if (row) {
          const wrap = el('div', 'ov-recent');
          wrap.appendChild(el('div', 'ov-recent-label', 'Letzte Spiele · neuestes links'));
          wrap.appendChild(row);
          frag.appendChild(wrap);
        }
      }

      if (flags.branding) {
        frag.appendChild(brandNode());
      }

      return frag.childElementCount ? frag : null;
    }

    function buildBar(data) {
      const bar = el('div', 'ov-bar');

      if (flags.header && streamer) {
        const seg = el('div', 'ov-seg');
        if (flags.live && data.live === true) seg.appendChild(el('span', 'ov-live-dot'));
        seg.appendChild(el('span', 'ov-seg-value', streamer));
        bar.appendChild(seg);
      }

      if (flags.live && data.live === true) {
        const seg = el('div', 'ov-seg');
        const live = el('div', 'ov-live');
        if (!flags.header) live.appendChild(el('span', 'ov-live-dot'));
        const details = [];
        if (data.hero) details.push(data.hero);
        if (isNumber(data.minutes)) details.push(data.minutes + '′');
        live.appendChild(el('span', null, details.length ? 'LIVE · ' + details.join(' · ') : 'LIVE'));
        seg.appendChild(live); bar.appendChild(seg);
      }

      for (const mod of activeModules(data)) {
        const seg = el('div', 'ov-seg');
        seg.appendChild(el('span', 'ov-seg-label', mod.label));
        seg.appendChild(mod.value());
        bar.appendChild(seg);
      }

      if (flags.recent) {
        const row = recentRow(data.recent);
        if (row) {
          const seg = el('div', 'ov-seg');
          seg.appendChild(el('span', 'ov-seg-label', 'Match-Verlauf'));
          seg.appendChild(row);
          bar.appendChild(seg);
        }
      }

      if (flags.branding) bar.appendChild(brandNode());
      return bar.childElementCount ? bar : null;
    }

    function canvasSource(key, label, content) {
      const source = el('section', 'ov-canvas-source');
      source.dataset.module = key;
      source.setAttribute('aria-label', label);
      const rect = canvasRect(key);
      source.style.left = `${rect.x / canvasWidth * 100}%`;
      source.style.top = `${rect.y / canvasHeight * 100}%`;
      source.style.width = `${rect.width / canvasWidth * 100}%`;
      source.style.height = `${rect.height / canvasHeight * 100}%`;
      source.appendChild(content);
      return source;
    }

    function buildCanvas(data) {
      const frag = document.createDocumentFragment();

      if (flags.header && streamer) {
        const head = el('div', 'ov-head');
        head.appendChild(el('div', 'ov-name', streamer));
        frag.appendChild(canvasSource('header', 'Spielername', head));
      }

      if (flags.live && data.live === true) {
        const live = el('div', 'ov-live');
        live.appendChild(el('span', 'ov-live-dot'));
        const details = [];
        if (data.hero) details.push(data.hero);
        if (isNumber(data.minutes)) details.push(`${data.minutes}′`);
        live.appendChild(el('span', null, details.length ? `LIVE · ${details.join(' · ')}` : 'LIVE'));
        frag.appendChild(canvasSource('live', 'Laufendes Spiel', live));
      }

      for (const mod of activeModules(data)) {
        const cell = el('div', 'ov-cell');
        cell.dataset.module = mod.key;
        cell.appendChild(el('div', 'ov-label', mod.label));
        cell.appendChild(mod.value());
        frag.appendChild(canvasSource(mod.key, mod.label, cell));
      }

      if (flags.recent) {
        const row = recentRow(data.recent);
        if (row) {
          const recent = el('div', 'ov-recent');
          recent.appendChild(el('div', 'ov-recent-label', 'Letzte Spiele · neuestes links'));
          recent.appendChild(row);
          frag.appendChild(canvasSource('recent', 'Match-Verlauf', recent));
        }
      }

      if (flags.branding) frag.appendChild(canvasSource('branding', 'Deutsche Deadlock Community', brandNode()));

      return frag.childElementCount ? frag : null;
    }

    function render(data) {
      if (!data || data.ok !== true) {
        hide();
        return;
      }
      latestData = data;

      const content = layout === 'bar' ? buildBar(data) : layout === 'canvas' ? buildCanvas(data) : buildBox(data);
      if (!content) {
        hide();
        return;
      }

      card.replaceChildren(content);
      card.classList.add('visible');
      fitViewport();
    }

    async function poll() {
      if (!streamer) {
        hide();
        return;
      }
      try {
        const response = await fetch(`/twitch/api/v2/public/overlay?streamer=${encodeURIComponent(streamer)}&mode=${mode}`, { cache: 'no-store' });
        if (!response.ok) {
          hide();
          return;
        }
        render(await response.json());
      } catch (_) {
        hide();
      }
    }

    poll();
    setInterval(poll, 20000);
  </script>
</body>
</html>
