<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caster-Szene · DDC</title><style>
*{box-sizing:border-box}html,body{color-scheme:dark;margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}.camera-slot{position:absolute;overflow:hidden;background:#080808;z-index:1}.camera-slot video,.camera-slot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#080808}.camera-slot.inactive{display:none}.background{position:absolute;inset:0;z-index:2;background:url('/twitch/caster-overlay/background.png') center/100% 100%;pointer-events:none}.scene[data-layout=solo] .background{clip-path:path(evenodd,'M0 0H1920V1080H0Z M400 170H1520V800H400Z')}.scene[data-layout=duo] .background{clip-path:path(evenodd,'M0 0H1920V1080H0Z M185 282H879V711H185Z M1043 282H1737V711H1043Z')}.scene[data-layout=trio] .background{clip-path:path(evenodd,'M0 0H1920V1080H0Z M70 320H610V670H70Z M690 320H1230V670H690Z M1310 320H1850V670H1310Z')}.label{position:absolute;z-index:3;display:flex;align-items:center;gap:16px;padding:0 16px;color:#faf8f5;background:linear-gradient(90deg,#343233,#4b484a);overflow:hidden}.label.inactive{display:none}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.handle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;opacity:.85}.scene[data-layout=solo] .camera-slot.s0{left:400px;top:170px;width:1120px;height:630px}.scene[data-layout=solo] .label.l0{left:400px;top:800px;width:1120px;height:58px}.scene[data-layout=solo] .label.l0 .name{font-size:34px}.scene[data-layout=solo] .label.l0 .handle{font-size:24px}.scene[data-layout=duo] .camera-slot.s0{left:185px;top:282px;width:694px;height:429px}.scene[data-layout=duo] .camera-slot.s1{left:1043px;top:282px;width:694px;height:429px}.scene[data-layout=duo] .label.l0{left:185px;top:711px;width:694px;height:44px}.scene[data-layout=duo] .label.l1{left:1043px;top:711px;width:694px;height:44px}.scene[data-layout=duo] .name{font-size:27px}.scene[data-layout=duo] .handle{font-size:19px}.scene[data-layout=trio] .camera-slot.s0{left:70px;top:320px;width:540px;height:350px}.scene[data-layout=trio] .camera-slot.s1{left:690px;top:320px;width:540px;height:350px}.scene[data-layout=trio] .camera-slot.s2{left:1310px;top:320px;width:540px;height:350px}.scene[data-layout=trio] .label.l0{left:70px;top:670px;width:540px;height:42px}.scene[data-layout=trio] .label.l1{left:690px;top:670px;width:540px;height:42px}.scene[data-layout=trio] .label.l2{left:1310px;top:670px;width:540px;height:42px}.scene[data-layout=trio] .name{font-size:22px}.scene[data-layout=trio] .handle{font-size:16px}.teams{position:absolute;z-index:4;left:90px;right:90px;top:58px;display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:start;color:#fff;text-shadow:0 2px 8px #000}.team{min-width:0}.team.right{text-align:right}.team-name{font-size:31px;font-weight:800;letter-spacing:.4px}.players{font-size:16px;opacity:.82;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.observer{align-self:center;padding:8px 16px;border-radius:999px;background:#131313cc;border:1px solid #d1a84b80;font-size:17px;white-space:nowrap}.observer:empty{display:none}
</style></head><body><main class="scene" id="scene" data-layout="duo"><div class="teams"><div class="team"><div class="team-name" id="team-a"></div><div class="players" id="players-a"></div></div><div class="observer" id="observer"></div><div class="team right"><div class="team-name" id="team-b"></div><div class="players" id="players-b"></div></div></div><div class="camera-slot s0" id="slot-0"><video autoplay muted playsinline></video><iframe allow="camera; autoplay" referrerpolicy="no-referrer"></iframe></div><div class="camera-slot s1" id="slot-1"><video autoplay muted playsinline></video><iframe allow="camera; autoplay" referrerpolicy="no-referrer"></iframe></div><div class="camera-slot s2" id="slot-2"><video autoplay muted playsinline></video><iframe allow="camera; autoplay" referrerpolicy="no-referrer"></iframe></div><div class="background"></div><div class="label l0" id="label-0"><span class="name"></span><span class="handle"></span></div><div class="label l1" id="label-1"><span class="name"></span><span class="handle"></span></div><div class="label l2" id="label-2"><span class="name"></span><span class="handle"></span></div></main><script>
'use strict';
const scene=document.getElementById('scene');
function resize(){scene.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}addEventListener('resize',resize);resize();
class NativeCamera{constructor(index,cameraId,video){this.index=index;this.cameraId=cameraId;this.video=video;this.pc=null;this.pending=[];this.ws=null;this.connect();}wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/twitch/caster-camera/ws?cameraId=${encodeURIComponent(this.cameraId)}&role=subscriber`;}connect(){this.ws=new WebSocket(this.wsUrl());this.ws.onmessage=e=>this.message(e);this.ws.onclose=()=>this.resetPeer();}resetPeer(){if(this.pc){this.pc.close();this.pc=null;}this.pending=[];this.video.srcObject=null;}close(){this.resetPeer();if(this.ws){this.ws.close();this.ws=null;}}send(target,data){if(this.ws?.readyState===WebSocket.OPEN)this.ws.send(JSON.stringify({type:'signal',targetPeerId:target,data}));}async ensurePeer(publisher){if(this.pc)return this.pc;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});this.pc=pc;pc.ontrack=e=>{this.video.srcObject=e.streams[0]||new MediaStream([e.track]);this.video.play().catch(()=>{});};pc.onicecandidate=e=>{if(e.candidate)this.send(publisher,{kind:'candidate',candidate:e.candidate});};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))this.resetPeer();};return pc;}async message(event){let msg;try{msg=JSON.parse(event.data);}catch{return;}if(msg.type==='publisher-left'||msg.type==='revoked'||msg.type==='not-available'){this.resetPeer();return;}if(msg.type!=='signal')return;const data=msg.data||{},from=msg.fromPeerId;if(data.kind==='offer'&&data.sdp){this.resetPeer();const pc=await this.ensurePeer(from);await pc.setRemoteDescription(data.sdp);for(const candidate of this.pending.splice(0)){try{await pc.addIceCandidate(candidate);}catch{}}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);this.send(from,{kind:'answer',sdp:pc.localDescription});}else if(data.kind==='candidate'&&data.candidate){if(this.pc?.remoteDescription){try{await this.pc.addIceCandidate(data.candidate);}catch{}}else this.pending.push(data.candidate);}}}
const native=[null,null,null];let nativeIds=['','',''];
function setCamera(index,caster){const host=document.getElementById(`slot-${index}`),video=host.querySelector('video'),frame=host.querySelector('iframe');const cameraId=typeof caster?.cameraId==='string'?caster.cameraId:'';const cameraUrl=typeof caster?.cameraUrl==='string'?caster.cameraUrl:'';if(cameraId){frame.removeAttribute('src');frame.style.display='none';video.style.display='block';if(nativeIds[index]!==cameraId){native[index]?.close();native[index]=new NativeCamera(index,cameraId,video);nativeIds[index]=cameraId;}}else{native[index]?.close();native[index]=null;nativeIds[index]='';video.srcObject=null;video.style.display='none';if(cameraUrl){if(frame.src!==cameraUrl)frame.src=cameraUrl;frame.style.display='block';}else{frame.removeAttribute('src');frame.style.display='none';}}}
function text(id,value){document.getElementById(id).textContent=value||'';}
function teamPlayers(team){return Array.isArray(team?.players)?team.players.map(p=>p?.displayName).filter(Boolean).slice(0,6).join(' · '):'';}
function observerName(ctx){const id=Number(ctx?.observerAccountId);if(!Number.isFinite(id))return'';for(const team of [ctx?.teamA,ctx?.teamB])for(const player of (team?.players||[]))if(Number(player?.accountId)===id)return `POV · ${player.displayName}`;return `POV · ${id}`;}
function render(payload){const layout=['solo','duo','trio'].includes(payload?.layout)?payload.layout:'duo';scene.dataset.layout=layout;const count=layout==='solo'?1:layout==='trio'?3:2;const slots=Array.isArray(payload?.slots)?payload.slots:[];for(let i=0;i<3;i++){const caster=i<count?slots[i]:null;const host=document.getElementById(`slot-${i}`),label=document.getElementById(`label-${i}`);host.classList.toggle('inactive',i>=count);label.classList.toggle('inactive',i>=count);label.querySelector('.name').textContent=typeof caster?.name==='string'?caster.name.slice(0,120):'';label.querySelector('.handle').textContent=typeof caster?.handle==='string'&&caster.handle?'@'+caster.handle.slice(0,120):'';setCamera(i,caster);}const ctx=payload?.matchContext||{};text('team-a',ctx.teamA?.name);text('players-a',teamPlayers(ctx.teamA));text('team-b',ctx.teamB?.name);text('players-b',teamPlayers(ctx.teamB));text('observer',observerName(ctx));}
const preview=new URLSearchParams(location.search).get('preview')==='1'&&parent!==window;if(preview){addEventListener('message',event=>{if(event.source!==parent||event.origin!=='https://admin.deutsche-deadlock-community.de'||event.data?.type!=='ddc-caster-preview')return;render(event.data);});}
let reportedFailure=false;async function refresh(){try{const response=await fetch('/twitch/api/v2/public/caster-overlay',{cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('HTTP '+response.status);render(await response.json());reportedFailure=false;}catch(error){if(!reportedFailure){console.warn('Caster-Szene: Aktualisierung fehlgeschlagen; letzte Anzeige bleibt erhalten.',error);reportedFailure=true;}}finally{if(!preview)setTimeout(refresh,2000);}}if(!preview)refresh();
addEventListener('beforeunload',()=>native.forEach(cam=>cam?.close()));
</script></body></html>
