'use strict';
const scene=document.getElementById('scene');
function resize(){scene.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}addEventListener('resize',resize);resize();
class NativeCamera{constructor(index,cameraId,video){this.index=index;this.cameraId=cameraId;this.video=video;this.pc=null;this.pending=[];this.ws=null;this.connect();}wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/twitch/caster-camera/ws?cameraId=${encodeURIComponent(this.cameraId)}&role=subscriber`;}connect(){this.ws=new WebSocket(this.wsUrl());this.ws.onmessage=e=>this.message(e);this.ws.onclose=()=>this.resetPeer();}resetPeer(){if(this.pc){this.pc.close();this.pc=null;}this.pending=[];this.video.srcObject=null;}close(){this.resetPeer();if(this.ws){this.ws.close();this.ws=null;}}send(target,data){if(this.ws?.readyState===WebSocket.OPEN)this.ws.send(JSON.stringify({type:'signal',targetPeerId:target,data}));}async ensurePeer(publisher){if(this.pc)return this.pc;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});this.pc=pc;pc.ontrack=e=>{this.video.srcObject=e.streams[0]||new MediaStream([e.track]);this.video.play().catch(()=>{});};pc.onicecandidate=e=>{if(e.candidate)this.send(publisher,{kind:'candidate',candidate:e.candidate});};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))this.resetPeer();};return pc;}async message(event){let msg;try{msg=JSON.parse(event.data);}catch{return;}if(msg.type==='publisher-left'||msg.type==='revoked'||msg.type==='not-available'){this.resetPeer();return;}if(msg.type!=='signal')return;const data=msg.data||{},from=msg.fromPeerId;if(data.kind==='offer'&&data.sdp){this.resetPeer();const pc=await this.ensurePeer(from);await pc.setRemoteDescription(data.sdp);for(const candidate of this.pending.splice(0)){try{await pc.addIceCandidate(candidate);}catch{}}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);this.send(from,{kind:'answer',sdp:pc.localDescription});}else if(data.kind==='candidate'&&data.candidate){if(this.pc?.remoteDescription){try{await this.pc.addIceCandidate(data.candidate);}catch{}}else this.pending.push(data.candidate);}}}
const native=[null,null,null];let nativeIds=['','',''];
function setCamera(index,caster){const host=document.getElementById(`slot-${index}`),video=host.querySelector('video'),frame=host.querySelector('iframe');const cameraId=typeof caster?.cameraId==='string'?caster.cameraId:'';const cameraUrl=typeof caster?.cameraUrl==='string'?caster.cameraUrl:'';if(cameraId){frame.removeAttribute('src');frame.style.display='none';video.style.display='block';if(nativeIds[index]!==cameraId){native[index]?.close();native[index]=new NativeCamera(index,cameraId,video);nativeIds[index]=cameraId;}}else{native[index]?.close();native[index]=null;nativeIds[index]='';video.srcObject=null;video.style.display='none';if(cameraUrl){if(frame.src!==cameraUrl)frame.src=cameraUrl;frame.style.display='block';}else{frame.removeAttribute('src');frame.style.display='none';}}}
function text(id,value){document.getElementById(id).textContent=value||'';}
function teamPlayers(team){return Array.isArray(team?.players)?team.players.map(p=>p?.displayName).filter(Boolean).slice(0,6).join(' · '):'';}
function observerName(ctx){const id=Number(ctx?.observerAccountId);if(!Number.isFinite(id))return'';for(const team of [ctx?.teamA,ctx?.teamB])for(const player of (team?.players||[]))if(Number(player?.accountId)===id)return `POV · ${player.displayName}`;return `POV · ${id}`;}
function setImage(img,url){const safe=typeof url==='string'&&url.startsWith('/twitch/caster-overlay/')?url:'';if(!safe){img.hidden=true;img.removeAttribute('src');return;}if(img.getAttribute('src')!==safe)img.src=safe;img.hidden=false;}
function renderTeam(id,team){const host=document.getElementById(id);const name=typeof team?.name==='string'?team.name.slice(0,120):'';host.classList.toggle('empty',!name);host.querySelector('.team-name').textContent=name;host.querySelector('.players').textContent=teamPlayers(team);setImage(host.querySelector('.team-logo'),team?.logoUrl);}
function renderEvent(event){const brand=document.getElementById('brand');if(typeof event?.brandUrl==='string')setImage(brand,event.brandUrl);brand.hidden=event?.showBrand===false;setImage(document.getElementById('event-logo'),event?event.logoUrl:'/twitch/caster-overlay/builtin/wochenende.webp');}
const chatBox=document.getElementById('chat'),chatList=document.getElementById('chat-list');const CHAT_MAX=40;let chatChannel='',chatWs=null,chatRetry=0,chatTimer=null;
function unescapeTag(value){return value.replace(/\\(s|:|\\)/g,(_,c)=>c==='s'?' ':c===':'?';':'\\');}
function parseIrc(line){let rest=line;const tags={};let prefix='';if(rest[0]==='@'){const i=rest.indexOf(' ');for(const part of rest.slice(1,i).split(';')){const j=part.indexOf('=');tags[j<0?part:part.slice(0,j)]=j<0?'':unescapeTag(part.slice(j+1));}rest=rest.slice(i+1);}if(rest[0]===':'){const i=rest.indexOf(' ');prefix=rest.slice(1,i);rest=rest.slice(i+1);}const t=rest.indexOf(' :');const trailing=t<0?'':rest.slice(t+2);const head=(t<0?rest:rest.slice(0,t)).split(' ');return{tags,prefix,command:head[0],params:head.slice(1),trailing};}
function readableColor(color){if(!/^#[0-9a-f]{6}$/i.test(color||''))return'#e0b95e';const n=parseInt(color.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const lum=(0.2126*r+0.7152*g+0.0722*b)/255;if(lum<0.45){const k=Math.min(1,(0.45-lum)/0.55+0.25);r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}return`rgb(${r|0},${g|0},${b|0})`;}
function emoteRanges(emotes,length){const ranges=[];for(const group of (emotes||'').split('/')){const [id,spots]=group.split(':');if(!id||!spots||!/^[\w-]+$/.test(id))continue;for(const spot of spots.split(',')){const [a,b]=spot.split('-').map(Number);if(Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&b>=a&&b<length)ranges.push([a,b,id]);}}return ranges.sort((x,y)=>x[0]-y[0]);}
function messageNodes(text,emotes){const chars=Array.from(text);const nodes=[];let pos=0;for(const [a,b,id] of emoteRanges(emotes,chars.length)){if(a<pos)continue;if(a>pos)nodes.push(document.createTextNode(chars.slice(pos,a).join('')));const img=document.createElement('img');img.className='chat-emote';img.alt=chars.slice(a,b+1).join('');img.src=`https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0`;nodes.push(img);pos=b+1;}if(pos<chars.length)nodes.push(document.createTextNode(chars.slice(pos).join('')));return nodes;}
function addChatLine(msg){const action=/^\u0001ACTION (.*)\u0001$/.exec(msg.trailing);const text=action?action[1]:msg.trailing;if(!text)return;const li=document.createElement('li');li.className='chat-line';li.dataset.id=msg.tags.id||'';li.dataset.user=msg.tags['user-id']||'';const name=document.createElement('span');name.className='chat-name';name.style.color=readableColor(msg.tags.color);name.textContent=(msg.tags['display-name']||msg.prefix.split('!')[0]||'').slice(0,40);li.append(name,document.createTextNode(action?' ':': '),...messageNodes(text.slice(0,500),msg.tags.emotes));chatList.append(li);while(chatList.children.length>CHAT_MAX)chatList.firstElementChild.remove();}
function removeChat(match){for(const li of [...chatList.children])if(match(li))li.remove();}
function chatLine(line){if(!line)return;const msg=parseIrc(line);switch(msg.command){case'PING':chatWs?.send('PONG :'+msg.trailing);break;case'PRIVMSG':addChatLine(msg);break;case'CLEARMSG':removeChat(li=>!!li.dataset.id&&li.dataset.id===msg.tags['target-msg-id']);break;case'CLEARCHAT':{const user=msg.tags['target-user-id'];removeChat(li=>!user||li.dataset.user===user);break;}case'ROOMSTATE':chatBox.classList.add('online');chatRetry=0;break;case'RECONNECT':chatWs?.close();break;}}
function closeChat(){clearTimeout(chatTimer);chatTimer=null;if(chatWs){chatWs.onclose=null;chatWs.close();chatWs=null;}chatBox.classList.remove('online');chatList.replaceChildren();}
function connectChat(){closeChat();if(!chatChannel)return;const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');chatWs=ws;ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+(10000+Math.floor(Math.random()*80000)));ws.send('JOIN #'+chatChannel);};ws.onmessage=e=>String(e.data).split('\r\n').forEach(chatLine);ws.onclose=()=>{if(chatWs!==ws)return;chatWs=null;chatBox.classList.remove('online');chatList.replaceChildren();chatTimer=setTimeout(connectChat,Math.min(30000,1000*2**chatRetry++));};}
function renderChat(chat){const channel=typeof chat?.channel==='string'&&/^[a-z0-9_]{1,25}$/.test(chat.channel)?chat.channel:'';const enabled=chat?.enabled===true&&!!channel;scene.dataset.chat=chat?.position==='left'?'left':'right';chatBox.hidden=!enabled;document.getElementById('chat-channel').textContent=channel?'twitch.tv/'+channel:'';const target=enabled?channel:'';if(target===chatChannel)return;chatChannel=target;chatList.replaceChildren();if(target)connectChat();else closeChat();}
function render(payload){const layout=['solo','duo','trio'].includes(payload?.layout)?payload.layout:'duo';scene.dataset.layout=layout;const count=layout==='solo'?1:layout==='trio'?3:2;const slots=Array.isArray(payload?.slots)?payload.slots:[];for(let i=0;i<3;i++){const caster=i<count?slots[i]:null;const host=document.getElementById(`slot-${i}`),label=document.getElementById(`label-${i}`);host.classList.toggle('inactive',i>=count);label.classList.toggle('inactive',i>=count);label.querySelector('.name').textContent=typeof caster?.name==='string'?caster.name.slice(0,120):'';label.querySelector('.handle').textContent=typeof caster?.handle==='string'&&caster.handle?'@'+caster.handle.slice(0,120):'';setCamera(i,caster);}const ctx=payload?.matchContext||{};const teams=payload?.teams||{left:ctx.teamA,right:ctx.teamB};renderTeam('team-left',teams.left);renderTeam('team-right',teams.right);renderEvent(payload?.event);text('observer',observerName(ctx));renderChat(payload?.chat);}
const preview=new URLSearchParams(location.search).get('preview')==='1'&&parent!==window;if(preview){addEventListener('message',event=>{if(event.source!==parent||event.origin!=='https://admin.deutsche-deadlock-community.de'||event.data?.type!=='ddc-caster-preview')return;render(event.data);});}
let reportedFailure=false;async function refresh(){try{const response=await fetch('/twitch/api/v2/public/caster-overlay',{cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('HTTP '+response.status);render(await response.json());reportedFailure=false;}catch(error){if(!reportedFailure){console.warn('Caster-Szene: Aktualisierung fehlgeschlagen; letzte Anzeige bleibt erhalten.',error);reportedFailure=true;}}finally{if(!preview)setTimeout(refresh,2000);}}if(!preview)refresh();
addEventListener('beforeunload',()=>{native.forEach(cam=>cam?.close());closeChat();});
