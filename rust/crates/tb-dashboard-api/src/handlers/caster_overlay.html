<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caster-Szene · DDC</title><style>
*{box-sizing:border-box}html,body{color-scheme:dark;margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}.background{position:absolute;inset:0;background:url('/twitch/caster-overlay/background.png') center/100% 100%;clip-path:path(evenodd,'M0 0H1920V1080H0Z M185 282H879V711H185Z M1043 282H1737V711H1043Z')}.label{position:absolute;top:711px;width:694px;height:44px;display:flex;align-items:center;gap:20px;padding:0 16px;color:#faf8f5;background:linear-gradient(90deg,#3e3c3d,#474546);overflow:hidden}.label:first-of-type{left:185px}.left{left:185px}.right{left:1043px}.name{font-size:27px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.handle{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
</style></head><body><main class="scene" id="scene"><div class="background"></div><div class="label left"><span class="name"></span><span class="handle"></span></div><div class="label right"><span class="name"></span><span class="handle"></span></div></main><script>
'use strict';
const scene=document.getElementById('scene');
function resize(){scene.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}addEventListener('resize',resize);resize();
function render(slots){if(!Array.isArray(slots)||slots.length!==2)return;document.querySelectorAll('.label').forEach((label,index)=>{const caster=slots[index];label.querySelector('.name').textContent=typeof caster?.name==='string'?caster.name.slice(0,120):'';label.querySelector('.handle').textContent=typeof caster?.handle==='string'&&caster.handle?'@'+caster.handle.slice(0,120):'';});}
const preview=new URLSearchParams(location.search).get('preview')==='1' && parent!==window;
if(preview){addEventListener('message',event=>{if(event.source!==parent||event.origin!=='https://admin.deutsche-deadlock-community.de'||event.data?.type!=='ddc-caster-preview')return;render(event.data.slots);});}
let reportedFailure=false;
async function refresh(){try{const response=await fetch('/twitch/api/v2/public/caster-overlay',{cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('HTTP '+response.status);render((await response.json()).slots);reportedFailure=false;}catch(error){if(!reportedFailure){console.warn('Caster-Szene: Aktualisierung fehlgeschlagen; letzte Anzeige bleibt erhalten.',error);reportedFailure=true;}}finally{if(!preview)setTimeout(refresh,2000);}}
if(!preview)refresh();
</script></body></html>
