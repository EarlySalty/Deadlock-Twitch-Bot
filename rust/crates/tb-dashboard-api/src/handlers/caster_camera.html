<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDC Caster-Kamera</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5}main{max-width:920px;margin:auto;padding:28px}.card{border:1px solid #343434;background:#121212;border-radius:18px;padding:20px;margin-bottom:18px}h1{margin:0 0 8px}p{color:#bbb;line-height:1.5}.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}.full{grid-column:1/-1}label{display:block;font-size:14px;color:#ccc}select,button{width:100%;min-height:46px;margin-top:6px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff;padding:10px 12px}button{cursor:pointer;border-color:#c89b3c;background:#2a2110;font-weight:700}button.secondary{border-color:#444;background:#181818}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;object-fit:cover}.status{font-size:14px;color:#d6b86c}.danger{color:#ffb0b0}.ok{color:#9ee6b0}.consent{display:flex;align-items:flex-start;gap:10px}.consent input{margin-top:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="card"><h1>Caster-Kamera freigeben</h1><p>Die Community speichert keine Videodatei. Dein Kamerabild wird nur live per WebRTC an die aktive Caster-Szene übertragen, solange diese Seite geöffnet ist. Die gespeicherte Freigabe kann jederzeit widerrufen werden.</p></div><div class="card grid"><label class="full">Kamera<select id="device"><option value="">Standardkamera</option></select></label><div class="full"><video id="preview" autoplay muted playsinline></video></div><label class="consent full"><input id="consent" type="checkbox"><span>Ich erlaube, dass diese Kamera in der DDC-Caster-Szene live abgerufen und ausgespielt werden darf. Mir ist klar, dass Zuschauer das Kamerabild im Stream sehen können.</span></label><button id="start" disabled>Kamera freigeben</button><button id="stop" class="secondary" disabled>Übertragung stoppen</button><button id="revoke" class="secondary full" disabled>Freigabe dauerhaft widerrufen</button><div id="status" class="status full">Noch nicht verbunden.</div></div></main><script>
'use strict';
const cameraId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
const device=document.getElementById('device'),preview=document.getElementById('preview'),consent=document.getElementById('consent'),start=document.getElementById('start'),stop=document.getElementById('stop'),revoke=document.getElementById('revoke'),status=document.getElementById('status');
let stream=null,ws=null,peers=new Map();
const wsUrl=()=>`${location.protocol==='https:'?'wss':'ws'}://${location.host}/twitch/caster-camera/ws?cameraId=${encodeURIComponent(cameraId)}&role=publisher`;
function setStatus(text,cls=''){status.textContent=text;status.className=`status ${cls}`;}
function closePeer(id){const pc=peers.get(id);if(pc){pc.close();peers.delete(id);}}
function closeAll(){for(const id of [...peers.keys()])closePeer(id);if(ws){ws.close();ws=null;}}
async function devices(){try{const list=await navigator.mediaDevices.enumerateDevices();const cams=list.filter(x=>x.kind==='videoinput');device.innerHTML='<option value="">Standardkamera</option>'+cams.map((x,i)=>`<option value="${x.deviceId}">${x.label||`Kamera ${i+1}`}</option>`).join('');}catch{}}
async function openMedia(){if(stream)stream.getTracks().forEach(t=>t.stop());const exact=device.value?{deviceId:{exact:device.value}}:true;stream=await navigator.mediaDevices.getUserMedia({video:exact,audio:false});preview.srcObject=stream;await devices();}
function send(target,data){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'signal',targetPeerId:target,data}));}
async function makeOffer(peerId){if(!stream)return;closePeer(peerId);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(peerId,pc);for(const track of stream.getTracks())pc.addTrack(track,stream);pc.onicecandidate=e=>{if(e.candidate)send(peerId,{kind:'candidate',candidate:e.candidate});};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))closePeer(peerId);};const offer=await pc.createOffer();await pc.setLocalDescription(offer);send(peerId,{kind:'offer',sdp:pc.localDescription});}
async function signal(from,data){const pc=peers.get(from);if(!pc)return;if(data?.kind==='answer'&&data.sdp){await pc.setRemoteDescription(data.sdp);}else if(data?.kind==='candidate'&&data.candidate){try{await pc.addIceCandidate(data.candidate);}catch{}}}
function connect(){closeAll();ws=new WebSocket(wsUrl());ws.onopen=()=>ws.send(JSON.stringify({type:'auth',token,consent:true}));ws.onmessage=async event=>{let msg;try{msg=JSON.parse(event.data);}catch{return;}if(msg.type==='auth-error'){setStatus('Einladungs-Link ungültig oder widerrufen.','danger');closeAll();return;}if(msg.type==='ready'){setStatus('Kamera ist freigegeben. Sie wird nur übertragen, wenn die Caster-Szene sie abruft.','ok');stop.disabled=false;revoke.disabled=false;}else if(msg.type==='revoke-ok'){setStatus('Freigabe dauerhaft widerrufen. Für eine spätere Nutzung ist ein neuer Einladungs-Link nötig.','ok');consent.checked=false;revoke.disabled=true;stop.disabled=true;closeAll();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;preview.srcObject=null;}}else if(msg.type==='subscriber-joined'){await makeOffer(msg.peerId);}else if(msg.type==='subscriber-left'){closePeer(msg.peerId);}else if(msg.type==='signal'){await signal(msg.fromPeerId,msg.data);}else if(msg.type==='replaced'||msg.type==='revoked'){setStatus('Diese Kamera-Verbindung wurde beendet.','danger');closeAll();}};ws.onclose=()=>{if(stream&&consent.checked)setStatus('Verbindung getrennt. Du kannst erneut freigeben.','danger');};}
consent.addEventListener('change',()=>start.disabled=!consent.checked||!token||!cameraId);
device.addEventListener('change',async()=>{if(stream){try{await openMedia();for(const id of [...peers.keys()])await makeOffer(id);}catch(e){setStatus(`Kamera konnte nicht gewechselt werden: ${e.message}`,'danger');}}});
start.addEventListener('click',async()=>{try{if(!token)throw new Error('Der Einladungs-Link enthält kein Publish-Token.');await openMedia();connect();start.disabled=true;}catch(e){setStatus(`Kamera nicht freigegeben: ${e.message}`,'danger');}});
stop.addEventListener('click',()=>{closeAll();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;preview.srcObject=null;}stop.disabled=true;revoke.disabled=true;start.disabled=!consent.checked;setStatus('Übertragung gestoppt. Die gespeicherte Freigabe bleibt bestehen.');});
revoke.addEventListener('click',()=>{if(!confirm('Freigabe dauerhaft widerrufen? Danach ist für diese Kamera ein neuer Einladungs-Link nötig.'))return;if(ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:'revoke'}));}else{setStatus('Zum Widerrufen die Kamera kurz erneut freigeben und dann hier widerrufen.','danger');}});
window.addEventListener('beforeunload',()=>{closeAll();if(stream)stream.getTracks().forEach(t=>t.stop());});
if(!token){setStatus('Dieser Link enthält kein gültiges Publish-Token. Bitte einen neuen Kamera-Link anfordern.','danger');start.disabled=true;}
</script></body></html>
