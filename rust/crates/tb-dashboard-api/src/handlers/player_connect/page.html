<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Twitch &amp; Steam verbinden · Deutsche Deadlock Community</title><style>
:root{color-scheme:dark;--gold:#c8a86b;--gold-bright:#e6cf9a;--bg:#0c0a07;--card-top:#17130d;--card-bottom:#120f0a;--line:rgba(200,168,107,.30);--ink:#f3ead9;--muted:#b7ad98;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}

ol{padding-left:22px;margin:24px 0}
li{padding:5px 0}

a{color:var(--gold-bright);text-underline-offset:4px}
