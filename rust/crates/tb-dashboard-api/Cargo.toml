[package]
name = "tb-dashboard-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
# ws: WebSocket-Upgrade fuer das OBS-Dock-Gateway (`GET /obs/ws`). axum bringt
# den Upgrade selbst mit, tokio-tungstenite braucht es dafuer nicht.
axum         = { workspace = true, features = ["multipart", "ws"] }
futures-util = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sqlx         = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
chrono-tz    = { workspace = true }
hmac         = { workspace = true }
pbkdf2       = { workspace = true }
pulldown-cmark = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
reqwest      = { workspace = true }
# time/rt/macros: Heartbeat-Intervalle, der Listener-Task und `select!` im
# OBS-Dock-Gateway.
tokio        = { workspace = true, features = ["sync", "time", "rt", "macros"] }
url          = { workspace = true }
uuid         = { workspace = true }
thiserror    = { workspace = true }
regex        = { workspace = true }
aes          = { workspace = true }
cbc          = { workspace = true }
base64       = { workspace = true }
async-trait  = { workspace = true }
rand         = { workspace = true }
tb-analytics  = { workspace = true }
tb-domain     = { workspace = true }
tb-error      = { workspace = true }
tb-http-core  = { workspace = true }
tb-crypto     = { workspace = true }
tb-chat       = { workspace = true }
tb-engagement = { workspace = true }
tb-knowledge  = { workspace = true }
tb-raid       = { workspace = true }
tb-social-media = { workspace = true }
tb-transport-twitch = { workspace = true }

[dev-dependencies]
tokio     = { workspace = true }
tower     = { workspace = true, features = ["util"] }
wiremock  = { workspace = true }
tb-db     = { workspace = true }
tb-config = { workspace = true }
