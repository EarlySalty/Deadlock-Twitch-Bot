[package]
name = "tb-dashboard-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
tb-effort = { workspace = true }
tb-config = { workspace = true }
tb-db     = { workspace = true }
dbrain-reasoner = { git = "https://github.com/EarlySalty/Deadlock-Brain.git", rev = "d8c34270868e129098e12243f53f5b52ee507b8b" }
axum         = { workspace = true, features = ["multipart", "ws"] }
futures-util = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
zeroize      = { workspace = true }
filedescriptor = "0.8.3"
nix = { version = "0.31", default-features = false, features = ["fs"] }
sqlx         = { workspace = true }
sqlx08       = { package = "sqlx", version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono"] }
tracing      = { workspace = true }
chrono       = { workspace = true }
chrono-tz    = { workspace = true }
hmac         = { workspace = true }
pbkdf2       = { workspace = true }
argon2       = "0.6"
pulldown-cmark = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
reqwest      = { workspace = true }
uplink-infisical-transport = { path = "../../vendor/uplink-infisical-transport" }
tokio        = { workspace = true, features = ["sync", "time", "rt", "macros"] }
url          = { workspace = true }
percent-encoding = "2.3.2"
uuid         = { workspace = true, features = ["serde"] }
thiserror    = { workspace = true }
regex        = { workspace = true }
aes          = { workspace = true }
cbc          = { workspace = true }
base64       = { workspace = true }
async-trait  = { workspace = true }
rand         = { workspace = true }
tb-analytics  = { workspace = true }
tb-domain     = { workspace = true }
tb-error      = { workspace = true }
tb-http-core  = { workspace = true }
tb-crypto     = { workspace = true }
tb-chat       = { workspace = true }
tb-engagement = { workspace = true }
tb-llm        = { workspace = true }
tb-knowledge  = { workspace = true }
tb-raid       = { workspace = true }
tb-scout      = { workspace = true }
tb-social-media = { workspace = true }
tb-transport-twitch = { workspace = true }
tb-vod-archive = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio     = { workspace = true, features = ["net", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
tower     = { workspace = true, features = ["util"] }
wiremock  = { workspace = true }
