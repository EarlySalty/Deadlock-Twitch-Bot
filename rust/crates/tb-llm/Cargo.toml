[package]
name = "tb-llm"
version = "0.1.0"
edition.workspace = true

[features]
default = []
local-eval = []
test-fixtures = []

[[bin]]
name = "tb-local-replay"
path = "src/bin/tb-local-replay.rs"
required-features = ["local-eval"]

[dependencies]
async-trait = { workspace = true }
brain-client = { workspace = true }
brain-contracts = { workspace = true }
uuid = { workspace = true }
tb-observability = { workspace = true }
fireworks-model-selection = { path = "../fireworks-model-selection" }
uplink-infisical-transport = { path = "../../vendor/uplink-infisical-transport" }
toml = "1.1"
fs2 = "0.4"
zeroize = { version = "1", features = ["serde"] }
serde = { workspace = true }
sha2 = { workspace = true }
libc = "0.2"
chrono      = { workspace = true }
regex       = { workspace = true }
reqwest     = { workspace = true }
serde_json  = { workspace = true }
base64 = { workspace = true }
tokio       = { workspace = true, features = ["time", "sync", "net", "io-util"] }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
jsonschema = { version = "=0.52.0", default-features = false }
tokio-tungstenite = "0.30"
futures-util = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
tempfile = "3"

[[bin]]
name = "tb-llm-usage-recover"
path = "src/bin/tb-llm-usage-recover.rs"
