[package]
name = "tb-llm"
version = "0.1.0"
edition.workspace = true

# Gemeinsame LLM-Client-Schicht (Phase-0-Foundation): genau zwei Provider —
# MiniMax (Primär) + Anthropic (Premium). Jeder erfolgreiche Call verbucht
# Tokens best-effort ins gemeinsame MiniMax-Usage-Ledger (zentrale Postgres).
[dependencies]
async-trait = { workspace = true }
chrono      = { workspace = true }
reqwest     = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["time", "sync"] }
tracing     = { workspace = true }
# sqlx mit Postgres-Feature: das Usage-Ledger liegt jetzt in der zentralen
# Postgres der übrigen Crates (Tabelle `minimax_usage`, per Migration angelegt),
# NICHT mehr in einer separaten SQLite-WAL-Datei. sqlx-postgres ist über den
# Workspace ohnehin im Lockfile — keine neue Version. Bewusst OHNE `macros`:
# die Ledger-Queries sind laufzeit-geprüft (`sqlx::query`/`query_scalar`), damit
# tb-llm keinen Compile-Time-`.sqlx`-Cache braucht und der Workspace-schema-gate
# nicht über eine gesonderte tb-llm-Cache-Datei stolpert.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
