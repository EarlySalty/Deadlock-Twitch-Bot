[package]
name = "tb-llm"
version = "0.1.0"
edition.workspace = true

# Gemeinsame LLM-Client-Schicht (Phase-0-Foundation): genau zwei Provider —
# MiniMax (Primär) + Anthropic (Premium). Jeder erfolgreiche Call verbucht
# Tokens best-effort ins gemeinsame MiniMax-Usage-Ledger (geteiltes SQLite).
[dependencies]
async-trait = { workspace = true }
chrono      = { workspace = true }
reqwest     = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["time", "sync"] }
tracing     = { workspace = true }
# Eigene sqlx-Instanz mit SQLite-Feature: das geteilte Usage-Ledger ist eine
# SQLite-WAL-Datei (cross-bot), NICHT das Postgres der übrigen Crates. sqlx-sqlite
# ist über `rusqlite`/Workspace bereits im Lockfile aufgelöst — keine neue Version.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
