[package]
name = "tb-llm"
version = "0.1.0"
edition.workspace = true

[features]
default = []
local-eval = []

[[bin]]
name = "tb-local-replay"
path = "src/bin/tb-local-replay.rs"
required-features = ["local-eval"]

# Gemeinsame LLM-Schicht des Twitch-Bots: ein zentraler HTTP-Weg (`hub`) nur
# für das freigegebene DeepSeek-V4-Flash-Modell bei Fireworks. Jeder
# erfolgreiche Call verbucht Tokens best-effort ins
# gemeinsame Usage-Ledger (Tabelle `llm_usage`, zentrale Postgres).
[dependencies]
fireworks-model-selection = { path = "../fireworks-model-selection" }
uplink-infisical-transport = { path = "../../vendor/uplink-infisical-transport" }
toml = "0.8"
fs2 = "0.4"
zeroize = { version = "1", features = ["serde"] }
serde = { workspace = true }
sha2 = { workspace = true }
libc = "0.2"
chrono      = { workspace = true }
regex       = { workspace = true }
reqwest     = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["time", "sync"] }
tracing     = { workspace = true }
# sqlx mit Postgres-Feature: das Usage-Ledger liegt jetzt in der zentralen
# Postgres der übrigen Crates (Tabelle `llm_usage`, per Migration angelegt),
# NICHT mehr in einer separaten SQLite-WAL-Datei. sqlx-postgres ist über den
# Workspace ohnehin im Lockfile — keine neue Version. Bewusst OHNE `macros`:
# die Ledger-Queries sind laufzeit-geprüft (`sqlx::query`/`query_scalar`), damit
# tb-llm keinen Compile-Time-`.sqlx`-Cache braucht und der Workspace-schema-gate
# nicht über eine gesonderte tb-llm-Cache-Datei stolpert.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
