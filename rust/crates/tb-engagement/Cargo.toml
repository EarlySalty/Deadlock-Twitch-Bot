[package]
name = "tb-engagement"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono     = { workspace = true }
regex      = { workspace = true }
reqwest    = { workspace = true, features = ["multipart"] }
serde_json = { workspace = true }
sqlx       = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
rand       = { workspace = true }
tokio      = { workspace = true, features = ["time", "rt", "net", "io-util", "process", "fs"] }
tb-crypto  = { workspace = true }
tb-llm     = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
# Dev-only SQLite-Zugriff, um den Ledger-Seiteneffekt von `generate()` direkt in
# der Temp-DB zu verifizieren (gleiche sqlx-Version, nur das sqlite-Feature, das
# tb-llm im Graphen ohnehin aktiviert).
sqlx     = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
