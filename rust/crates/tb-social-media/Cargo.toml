[package]
name    = "tb-social-media"
version = "0.1.0"
edition = { workspace = true }

[dependencies]
sqlx              = { workspace = true }
tokio             = { workspace = true, features = ["process", "fs", "io-util", "rt-multi-thread", "macros"] }
tracing           = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
toml              = { version = "1.1.6", default-features = false, features = ["display", "serde", "parse"] }
chrono            = { workspace = true }
chrono-tz         = { workspace = true }
tb-transport-twitch = { workspace = true }
tb-crypto         = { workspace = true }
tb-config         = { workspace = true }
tb-engagement     = { workspace = true }
tb-llm            = { workspace = true }
url               = { workspace = true }
sha2              = { workspace = true }
base64            = { workspace = true }
thiserror         = { workspace = true }
reqwest           = { workspace = true, features = ["multipart"] }
regex             = { workspace = true }
async-trait       = { workspace = true }

[[bin]]
name = "korpus_ernte"
path = "src/bin/korpus_ernte.rs"

[dev-dependencies]
serde_yaml = "0.9"
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wiremock = { workspace = true }
tempfile = "3"

[[bin]]
name = "render_clips"
path = "src/bin/render_clips.rs"
