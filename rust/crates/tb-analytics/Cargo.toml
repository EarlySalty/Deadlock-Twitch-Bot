[package]
name = "tb-analytics"
version = "0.1.0"
edition.workspace = true

[dependencies]
futures-util = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
zeroize = { workspace = true }
tb-config = { workspace = true }
zstd = "0.13"
tempfile = "3"
tb-stream-audit = { workspace = true }
nix = { version = "0.31", features = ["fs"] }
whatlang = "=0.18.0"
sqlx       = { workspace = true, features = ["uuid"] }
serde      = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex      = { workspace = true }
reqwest    = { workspace = true }
chrono     = { workspace = true }
chrono-tz  = { workspace = true }
sha2       = { workspace = true }
hmac       = { workspace = true }
hex        = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tokio      = { workspace = true, features = ["time", "sync", "fs", "process"] }
printpdf   = { workspace = true }
lettre     = { workspace = true }
tb-error   = { workspace = true }
tb-crypto  = { workspace = true }
tb-domain  = { workspace = true }
tb-raid    = { workspace = true }
tb-llm     = { workspace = true }
tb-transport-twitch = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio      = { workspace = true }
tb-config  = { workspace = true }
tb-db      = { workspace = true }
wiremock   = { workspace = true }
