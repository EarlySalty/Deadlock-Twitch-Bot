[package]
name = "tb-bot"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "tb-bot"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
axum               = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono              = { workspace = true }
chrono-tz           = { workspace = true }
reqwest             = { workspace = true }
sqlx                = { workspace = true }
tb-config           = { workspace = true }
tb-crypto           = { workspace = true }
tb-db               = { workspace = true }
tb-internal-api     = { workspace = true }
tb-chat            = { workspace = true }
tb-monitoring       = { workspace = true }
tb-raid             = { workspace = true }
tb-transport-discord = { workspace = true }
tb-transport-twitch = { workspace = true }
tb-social-media          = { workspace = true }
tb-analytics             = { workspace = true }
tb-highlight             = { workspace = true }
tb-engagement            = { workspace = true }
strsim                   = { workspace = true }
unicode-normalization    = { workspace = true }

[features]
integration = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
sqlx  = { workspace = true }
wiremock = { workspace = true }
