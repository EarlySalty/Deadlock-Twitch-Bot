[package]
build = "../build_revision.rs"
name = "tb-category-collector"
version = "0.1.0"
edition.workspace = true

[dependencies]
tb-config = { workspace = true }
chrono-tz = { workspace = true }
tb-analytics = { workspace = true }
tb-monitoring = { workspace = true }
tb-transport-twitch = { workspace = true }
tokio = { workspace = true, features = ["sync", "signal", "time", "fs", "io-util"] }
sqlx = { workspace = true }
whoami = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
zeroize = { workspace = true }
nix = { version = "0.31", features = ["fs", "user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
tempfile = "3"
