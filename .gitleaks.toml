title = "Deadlock bots custom gitleaks config"

[extend]
useDefault = true

# [[allowlists]] statt [allowlist]: gitleaks laesst beide Formen nicht
# nebeneinander zu und lehnt die Konfiguration sonst ganz ab.
[[allowlists]]
description = "Fremd- und Build-Artefakte, kein eigener Code."
paths = [
  "(.*/)?node_modules/.*",
  "(.*/)?dist/.*",
  "(.*/)?build/.*",
  "(.*/)?target/.*"
]

# Ausnahmen zu den mitgelieferten Default-Regeln. Ohne sie meldet der Lauf ueber
# die volle Historie 24 Treffer, von denen keiner ein Geheimnis ist — ein
# dauerhaft roter Job, in den niemand mehr schaut. Jede Ausnahme unten ist
# einzeln geprueft; eine neue braucht denselben Nachweis: warum der Treffer kein
# Geheimnis ist, nicht nur dass er stoert.

[[allowlists]]
description = "Discord-Snowflakes sind oeffentlich: Application-, Guild-, Rollen-, Kanal- und User-IDs stehen in jedem OAuth-Link und in jeder Einladung. Geheim ist allein das Client-Secret, das eine eigene Regel und einen eigenen Eintrag hat. Die Regel ist als Ganzes aus, sonst meldet jede neue Rollen-ID im Code wieder einen Fund."
targetRules = ["discord-client-id"]
regexTarget = "line"
regexes = ['''.*''']

[[allowlists]]
description = "Kein Geheimnis, sondern der Name einer importierten Konstante: die Fundzeile in bot/internal_api/app.py ist ein Import-Alias der Form `X as _Y` ohne Stringliteral. Die Datei existiert nur noch in der Historie, der Scan laeuft mit fetch-depth 0 darueber."
targetRules = ["discord-client-secret"]
paths = ['''bot/internal_api/app\.py''']

[[allowlists]]
description = "Testfixtures und Dokumentation. fernet.rs: base64 von testkey1234567890 in den Verschluesselungstests. Security.tsx: Demo-Chiffrate der Sicherheitskonzept-Seite, mit einem Wegwerf-Schluessel ueber Dummy-Klartext erzeugt und ohne diesen wertlos, mit derselben Begruendung schon in .gitguardian.yaml. affiliate_commission.rs: Bezeichner in einem SQL-Rohstring. follower_funnel.rs: Dateiname in einem Doc-Kommentar. build-plan-dag.md: Task-IDs eines Bauplans."
targetRules = ["generic-api-key"]
paths = [
  '''rust/crates/tb-dashboard-api/src/auth/fernet\.rs''',
  '''rust/crates/tb-dashboard-api/src/handlers/follower_funnel\.rs''',
  '''rust/crates/tb-analytics/src/affiliate_commission\.rs''',
  '''rust/docs/implementation/2026-06-15-build-plan-dag\.md''',
  '''website/src/components/sections/Security\.tsx''',
]

# Neue Ausnahmen gelten nur bei gleichzeitig passendem Pfad UND exaktem
# Fixture-Wert. Ein neuer Schlüssel in derselben Datei bleibt ein Fund.
# Wiedervorlage: 2026-12-22 oder bei Änderung der jeweiligen Fixture.
[[allowlists]]
description = "Sechs feste UUIDs im ActionInput-Validierungstest, keine Authentifizierungsschlüssel."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^rust/crates/tb-dashboard-api/src/handlers/ad_manager\.rs$''']
regexTarget = "line"
regexes = ['''^\s*idempotency_key: "018f0f65-7c2e-7df1-9f64-4a8f5b71123[4-9]"\.into\(\),\s*$''']

[[allowlists]]
description = "WebSocket-Testnonce: base64 von 'the sample nonce', nur im Test einer abgewiesenen Cookie-Anfrage."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^rust/crates/tb-dashboard-api/src/obs/ws\.rs$''']
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Zwei bestehende Demo-Chiffrate der Security-Animation, aus sections/Security.tsx in partner-clean kopiert; kein entschlüsselnder Schlüssel und kein OAuth-Token."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^website/src/components/partner-clean/Security\.tsx$''']
regexTarget = "secret"
regexes = [
  '''^01027631cc1a318fc855cd096f414d4eb9140a1efaabbe7033619b7376eb2ade6399c5600e0bde49e5a9a314708da992a6e6c430146335861b9766631c795c9379b40f03da76d94ee642ec$''',
  '''^010276315877678bb2ed322b62caed1893dda920643dafb46c11418b47095a2276fa41c0b95787b2fba008224c4d32173bfd6631bbca88554ed73a66aea84ff9de382af161cde3f65398480e$''',
]

[[rules]]
id = "deadlock-discord-bot-token"
description = "Potential Discord bot token assignment"
regex = '''(?i)(discord|bot).{0,24}(token|secret|key).{0,8}[:=]\s*["']?(mfa\.[A-Za-z0-9_-]{20,}|[MN][A-Za-z0-9]{23}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27})'''
tags = ["discord", "token", "deadlock-custom"]

[[rules.allowlists]]
regexes = ['''(?i)(example|sample|dummy|test|fake|placeholder|changeme)''']

[[rules]]
id = "deadlock-twitch-oauth-token"
description = "Potential Twitch OAuth token assignment"
regex = '''(?i)(twitch|irc).{0,20}(oauth|token|password).{0,8}[:=]\s*["']?oauth:[a-z0-9]{20,}'''
tags = ["twitch", "oauth", "deadlock-custom"]

[[rules.allowlists]]
regexes = ['''(?i)(example|sample|dummy|test|fake|placeholder|changeme)''']

[[rules]]
id = "deadlock-steam-token"
description = "Potential Steam refresh or machine auth token assignment"
regex = '''(?i)(steam).{0,24}(refresh[_-]?token|machine[_-]?auth[_-]?token).{0,8}[:=]\s*["']?[A-Za-z0-9._-]{20,}'''
tags = ["steam", "token", "deadlock-custom"]

[[rules.allowlists]]
regexes = ['''(?i)(example|sample|dummy|test|fake|placeholder|changeme)''']
